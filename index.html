<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Inventory Management</h1>
    <form id="inventoryForm">
      <div class="form-group">
        <label for="employeeName">Nama Karyawan</label>
        <input type="text" id="employeeName" placeholder="Masukkan nama karyawan" required>
      </div>
      <div class="form-group">
        <label for="supervisorName">Supervisor</label>
        <input type="text" id="supervisorName" placeholder="Masukkan nama supervisor" required>
      </div>
      <div class="form-group">
        <label for="storeNumber">Nomor Toko</label>
        <input type="text" id="storeNumber" placeholder="Nomor toko" required>
      </div>
      <div class="form-group">
        <label for="storeLocation">Lokasi Toko</label>
        <input type="text" id="storeLocation" placeholder="Lokasi toko" required>
      </div>
      <div class="form-group">
        <label for="date">Tanggal</label>
        <input type="date" id="date" required>
      </div>
      <div class="form-group">
        <label for="itemName">Nama Barang</label>
        <input type="text" id="itemName" placeholder="Nama barang" required>
      </div>
      <div class="form-group">
        <label for="itemPrice">Harga Barang</label>
        <input type="number" id="itemPrice" placeholder="Harga barang" step="any" required>
      </div>
      <div class="form-group">
        <label for="itemStock">Stok Awal</label>
        <input type="number" id="itemStock" placeholder="Stok awal" step="any" required>
      </div>
      <button type="button" id="addItem" class="btn">Tambah Barang</button>
    </form>
    <h2>Daftar Barang</h2>
    <div class="table-container">
      <table id="inventoryTable">
        <thead>
          <tr>
            <th>Barang</th>
            <th>Harga</th>
            <th>Stok</th>
            <th>Terjual</th>
            <th>Sisa</th>
            <th>Rusak</th>
            <th>Layak</th>
            <th>Susut</th>
            <th>DIV</th>
            <th>Keterangan</th>
            <th>Action</th> <!-- Kolom Action untuk tombol Hapus -->
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <!-- Modal Edit -->
      <div id="editModal" class="modal">
        <div class="modal-content">
          <h2>Edit Data Barang</h2>
          <form id="editForm">
            <div class="form-group">
              <label for="sold">Barang Terjual</label>
              <input type="number" id="sold" step="any" placeholder="Jumlah barang terjual">
            </div>
            <div class="form-group">
              <label for="damaged">Barang Rusak</label>
              <input type="number" id="damaged" step="any" placeholder="Jumlah barang rusak">
            </div>
            <div class="form-group">
              <label for="notes">Keterangan</label>
              <input type="text" id="notes" placeholder="Keterangan tambahan">
            </div>
            <button type="button" class="btn" id="saveEdit">Simpan</button>
            <button type="button" class="btn" id="cancelEdit">Batal</button>
          </form>
        </div>
      </div>
    </div>
    <button id="exportData" class="btn">Export ke XLSX</button>
  </div>

  <!-- SheetJS (XLSX.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Custom JavaScript -->
  <script src="script.js"></script>
</body>
</html>
