<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUDA - Inventori Stok per Gudang</title>
    <style>
        /* ==================== RESET & BASE ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }

        /* ==================== HEADER ==================== */
        .app-header {
            background: #FFFFFF;
            color: #006B54;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .app-header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #006B54;
        }
        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #006B54;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        #user-name-display {
            font-weight: 600;
            color: #006B54;
            margin-left: auto;
            margin-right: 10px;
        }
        .logout-btn {
            background: none;
            border: 1px solid #006B54;
            border-radius: 15px;
            padding: 8px 12px;
            color: #006B54;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: #006B54;
            color: white;
        }
        .logout-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* ==================== MAIN CONTENT ==================== */
        .main-content {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Filter Section */
        .filter-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .filter-group {
            flex: 1 1 200px;
        }
        .filter-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #006B54;
        }
        .filter-group select, .filter-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 15px;
            font-size: 1rem;
            background: white;
        }
        .filter-actions {
            display: flex;
            gap: 10px;
        }
        button {
            border-radius: 15px;
            padding: 12px 24px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #006B54;
            color: white;
            border: 1px solid #006B54;
        }
        .btn-primary:hover {
            background: #005a46;
        }
        .btn-secondary {
            background: #d9d9d9;
            color: #333;
            border: 1px solid #d9d9d9;
        }
        .btn-secondary:hover {
            background: #cccccc;
        }

        /* Tabel Stok */
        .table-wrapper {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        th {
            background: #006B54;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        tr:hover {
            background: #f5f5f5;
        }
        .stock-low {
            background-color: #fff3cd;
            color: #856404;
            font-weight: 600;
        }
        .stock-out {
            background-color: #f8d7da;
            color: #721c24;
            font-weight: 600;
        }
        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid #006B54;
            background: white;
            color: #006B54;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 5px;
            padding: 0;
        }
        .action-btn:hover {
            background: #006B54;
            color: white;
        }
        .action-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #006B54;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #333;
        }

        /* Notifikasi */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            border-radius: 15px;
            background: #006B54;
            color: white;
            display: none;
            z-index: 2000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Loading */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #006B54;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="app-header">
        <button class="back-btn" onclick="window.location.href='index.html'">
            <svg viewBox="0 0 24 24">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <h1>Inventori Stok per Gudang</h1>
        <span id="user-name-display"></span>
        <button class="logout-btn" onclick="logout()">
            <svg viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </button>
    </header>

    <div class="main-content">
        <!-- Filter Section -->
        <div class="filter-section">
            <div class="filter-group">
                <label>Pilih Gudang</label>
                <select id="warehouse-select">
                    <option value="">-- Semua Gudang --</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Cari Produk</label>
                <input type="text" id="search-input" placeholder="Nama, kode, barcode...">
            </div>
            <div class="filter-group">
                <label>Filter Stok</label>
                <select id="stock-filter">
                    <option value="all">Semua</option>
                    <option value="low">Stok Menipis (di bawah min)</option>
                    <option value="out">Stok Habis</option>
                    <option value="positive">Stok > 0</option>
                </select>
            </div>
            <div class="filter-actions">
                <button class="btn-primary" onclick="loadStockData()">Tampilkan</button>
                <button class="btn-secondary" onclick="resetFilters()">Reset</button>
                <button class="btn-secondary" onclick="exportStockToCSV()">Ekspor CSV</button>
            </div>
        </div>

        <!-- Tabel Stok -->
        <div class="table-wrapper">
            <table id="stock-table">
                <thead>
                    <tr>
                        <th>Kode</th>
                        <th>Nama Produk</th>
                        <th>Batch</th>
                        <th>Stok</th>
                        <th>Min Stok</th>
                        <th>Max Stok</th>
                        <th>Harga Dasar</th>
                        <th>Nilai Stok</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="stock-tbody">
                    <tr><td colspan="9" style="text-align:center;">Pilih gudang dan klik Tampilkan</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Detail Batch -->
    <div class="modal-overlay" id="batch-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Detail Batch / Serial</h2>
                <button class="close-btn" onclick="closeBatchModal()">&times;</button>
            </div>
            <div class="modal-body" id="batch-modal-body">
                <!-- konten diisi javascript -->
            </div>
        </div>
    </div>

    <!-- Loading & Notifikasi -->
    <div id="loading" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div style="margin-top:20px; color:#006B54;">Memuat data...</div>
    </div>
    <div id="notification" class="notification"></div>

    <script src="app.js"></script>
    <script src="inventory-core.js"></script>
    <script src="warehouse.js"></script>
    <!-- file lain jika diperlukan, misal opname.js untuk fungsi terkait -->
    <script>
        // ==================== GLOBAL VARIABLES ====================
        let currentWarehouseId = null;
        let currentStockData = [];

        // ==================== FUNGSI HELPER ====================
        function showNotification(message, type = 'info') {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.style.backgroundColor = type === 'success' ? '#006B54' : (type === 'error' ? '#dc3545' : '#ffc107');
            notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, 3000);
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function formatRupiah(angka) {
            return 'Rp ' + angka.toLocaleString('id-ID');
        }

        // ==================== LOAD DATA GUDANG ====================
        async function loadWarehousesForSelect() {
            const select = document.getElementById('warehouse-select');
            select.innerHTML = '<option value="">-- Semua Gudang --</option>';
            try {
                const warehouses = await loadWarehouses(); // dari warehouse.js
                warehouses.forEach(w => {
                    if (w.is_active !== false) {
                        const opt = document.createElement('option');
                        opt.value = w.id;
                        opt.textContent = `${w.code} - ${w.name}`;
                        select.appendChild(opt);
                    }
                });
            } catch (error) {
                console.error('Gagal load gudang:', error);
            }
        }

        // ==================== LOAD DATA STOK ====================
        async function loadStockData() {
            const warehouseId = document.getElementById('warehouse-select').value;
            const search = document.getElementById('search-input').value.toLowerCase().trim();
            const filter = document.getElementById('stock-filter').value;

            showLoading();
            try {
                let stocks;
                if (warehouseId) {
                    stocks = await getStocksByWarehouse(parseInt(warehouseId)); // dari inventory-core.js
                } else {
                    stocks = await getAllStocks(); // dari inventory-core.js
                }

                // Gabungkan dengan data item
                const items = await loadKasirItems();
                const enriched = [];
                for (let s of stocks) {
                    const item = items.find(i => i.id === s.item_id);
                    if (!item) continue;

                    // Filter berdasarkan pencarian
                    if (search) {
                        const match = item.name.toLowerCase().includes(search) ||
                                     item.code.toLowerCase().includes(search) ||
                                     (item.barcode && item.barcode.toLowerCase().includes(search));
                        if (!match) continue;
                    }

                    // Filter stok
                    if (filter === 'low' && s.quantity >= (s.min_stock || 5)) continue;
                    if (filter === 'out' && s.quantity > 0) continue;
                    if (filter === 'positive' && s.quantity <= 0) continue;

                    enriched.push({
                        ...s,
                        item_name: item.name,
                        item_code: item.code,
                        harga_dasar: item.hargaDasar || 0,
                        min_stock: s.min_stock || item.minStock || 5,
                        max_stock: s.max_stock || 0,
                        nilai_stok: (item.hargaDasar || 0) * s.quantity
                    });
                }

                currentStockData = enriched;
                renderStockTable(enriched);
            } catch (error) {
                console.error('Gagal load stok:', error);
                showNotification('Gagal memuat data stok: ' + error.message, 'error');
                document.getElementById('stock-tbody').innerHTML = '<tr><td colspan="9" style="color:red; text-align:center;">Gagal memuat data</td></tr>';
            } finally {
                hideLoading();
            }
        }

        function renderStockTable(data) {
            const tbody = document.getElementById('stock-tbody');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">Tidak ada data stok</td></tr>';
                return;
            }
            let html = '';
            data.forEach(s => {
                const rowClass = s.quantity <= 0 ? 'stock-out' : (s.quantity < s.min_stock ? 'stock-low' : '');
                html += `<tr class="${rowClass}">
                    <td>${s.item_code}</td>
                    <td>${s.item_name}</td>
                    <td>${s.batch_id ? 'Batch: ' + s.batch_id : '-'}</td>
                    <td>${s.quantity}</td>
                    <td>${s.min_stock}</td>
                    <td>${s.max_stock || '-'}</td>
                    <td>${formatRupiah(s.harga_dasar)}</td>
                    <td>${formatRupiah(s.nilai_stok)}</td>
                    <td>
                        <button class="action-btn" onclick="showBatchDetail(${s.item_id}, ${s.warehouse_id})" title="Lihat Batch">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="12" y1="8" x2="12" y2="16"/>
                                <line x1="8" y1="12" x2="16" y2="12"/>
                            </svg>
                        </button>
                        <button class="action-btn" onclick="adjustStock(${s.item_id}, ${s.warehouse_id})" title="Adjust Stok">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 20h9M16.5 3.5l4 4L7 21H3v-4L16.5 3.5z"/>
                            </svg>
                        </button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        // ==================== FUNGSI UNTUK BATCH DETAIL ====================
        async function showBatchDetail(itemId, warehouseId) {
            try {
                const batches = await getBatchesByItemAndWarehouse(itemId, warehouseId); // dari inventory-core.js
                const serials = await getSerialsByItemAndWarehouse(itemId, warehouseId); // dari inventory-core.js
                const item = (await loadKasirItems()).find(i => i.id === itemId);

                let html = `<h3>${item ? item.name : 'Item'}</h3>`;
                html += '<h4>Batch</h4>';
                if (batches.length === 0) {
                    html += '<p>Tidak ada batch.</p>';
                } else {
                    html += '<table class="data-table" style="width:100%;"><thead><tr><th>Batch No</th><th>Expiry</th><th>Qty</th><th>Harga Beli</th></tr></thead><tbody>';
                    batches.forEach(b => {
                        html += `<tr>
                            <td>${b.batch_number}</td>
                            <td>${b.expiry_date ? new Date(b.expiry_date).toLocaleDateString('id-ID') : '-'}</td>
                            <td>${b.quantity}</td>
                            <td>${formatRupiah(b.purchase_price || 0)}</td>
                        </tr>`;
                    });
                    html += '</tbody></table>';
                }

                html += '<h4>Serial Number</h4>';
                if (serials.length === 0) {
                    html += '<p>Tidak ada serial number.</p>';
                } else {
                    html += '<table class="data-table" style="width:100%;"><thead><tr><th>Serial</th><th>Status</th><th>Batch</th></tr></thead><tbody>';
                    serials.forEach(s => {
                        html += `<tr>
                            <td>${s.serial_number}</td>
                            <td>${s.status}</td>
                            <td>${s.batch_id || '-'}</td>
                        </tr>`;
                    });
                    html += '</tbody></table>';
                }

                document.getElementById('batch-modal-body').innerHTML = html;
                document.getElementById('batch-modal').style.display = 'flex';
            } catch (error) {
                showNotification('Gagal memuat detail batch: ' + error.message, 'error');
            }
        }

        function closeBatchModal() {
            document.getElementById('batch-modal').style.display = 'none';
        }

        // ==================== FUNGSI ADJUST STOK (redirect ke opname) ====================
        function adjustStock(itemId, warehouseId) {
            // Bisa diarahkan ke halaman opname dengan parameter
            if (confirm('Buat stocktake untuk item ini? Anda akan diarahkan ke halaman opname.')) {
                window.location.href = `opname.html?item=${itemId}&warehouse=${warehouseId}`;
            }
        }

        // ==================== RESET FILTER ====================
        function resetFilters() {
            document.getElementById('warehouse-select').value = '';
            document.getElementById('search-input').value = '';
            document.getElementById('stock-filter').value = 'all';
            loadStockData();
        }

        // ==================== EKSPOR CSV ====================
        function exportStockToCSV() {
            if (currentStockData.length === 0) {
                alert('Tidak ada data untuk diekspor');
                return;
            }
            let csv = 'Kode,Nama,Batch,Stok,Min Stok,Max Stok,Harga Dasar,Nilai Stok\n';
            currentStockData.forEach(s => {
                csv += `"${s.item_code}","${s.item_name}","${s.batch_id || ''}",${s.quantity},${s.min_stock},${s.max_stock || ''},${s.harga_dasar},${s.nilai_stok}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `stok_gudang_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        // ==================== SESSION CHECK & INIT ====================
        async function checkSession() {
            const savedUser = sessionStorage.getItem('currentUser');
            if (!savedUser) {
                window.location.href = 'index.html';
                return false;
            }
            try {
                const parsed = JSON.parse(savedUser);
                if (parsed.id === 'bypass') {
                    document.getElementById('user-name-display').textContent = parsed.name;
                    return true;
                }
                const tx = db.transaction(['users'], 'readonly');
                const store = tx.objectStore('users');
                const request = store.get(parsed.id);
                const user = await new Promise((resolve, reject) => {
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = reject;
                });
                if (user) {
                    document.getElementById('user-name-display').textContent = user.name;
                    return true;
                } else {
                    sessionStorage.removeItem('currentUser');
                    window.location.href = 'index.html';
                    return false;
                }
            } catch (e) {
                window.location.href = 'index.html';
                return false;
            }
        }

        function logout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        // ==================== INIT ====================
        async function initPage() {
            showLoading();
            try {
                // Pastikan db sudah terinisialisasi (dari app.js)
                if (!db) {
                    await new Promise(resolve => {
                        const checkDb = setInterval(() => {
                            if (db) {
                                clearInterval(checkDb);
                                resolve();
                            }
                        }, 100);
                    });
                }
                const sessionOk = await checkSession();
                if (!sessionOk) return;

                await loadWarehousesForSelect();
                // Jika ada parameter di URL, set gudang
                const urlParams = new URLSearchParams(window.location.search);
                const warehouseParam = urlParams.get('warehouse');
                if (warehouseParam) {
                    document.getElementById('warehouse-select').value = warehouseParam;
                }
                await loadStockData();
            } catch (error) {
                console.error('Init error:', error);
                showNotification('Gagal memuat halaman: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        window.onload = initPage;
        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.style.display = 'none';
            }
        };
    </script>
</body>
</html>
