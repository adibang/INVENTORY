<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUDA - Inventori Stok per Gudang</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <style>
        /* ==================== RESET & BASE ==================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f5f5f5; color: #333; min-height: 100vh; line-height: 1.5; }

        /* ==================== HEADER ==================== */
        .app-header {
            background: #FFFFFF; color: #006B54; padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; gap: 15px;
        }
        .app-header h1 { font-size: 1.2rem; font-weight: 600; color: #006B54; }
        .back-btn {
            background: none; border: none; cursor: pointer; color: #006B54;
            display: flex; align-items: center; justify-content: center; padding: 8px;
        }
        .back-btn svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; }
        #user-name-display { font-weight: 600; color: #006B54; margin-left: auto; margin-right: 10px; }
        .logout-btn {
            background: none; border: 1px solid #006B54; border-radius: 15px;
            padding: 8px 12px; color: #006B54; display: inline-flex;
            align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s;
        }
        .logout-btn:hover { background: #006B54; color: white; }
        .logout-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }

        /* ==================== MAIN CONTENT ==================== */
        .main-content { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .page-header h2 { color: #006B54; font-size: 1.5rem; display: flex; align-items: center; gap: 8px; }

        /* Tombol */
        button {
            border-radius: 15px; padding: 8px 16px; font-weight: 600; cursor: pointer;
            border: 1px solid transparent; font-size: 0.9rem; display: inline-flex;
            align-items: center; gap: 6px; transition: all 0.2s;
        }
        .btn-primary { background: #006B54; color: white; border: 1px solid #006B54; }
        .btn-primary:hover { background: #005a46; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary { background: #d9d9d9; color: #333; border: 1px solid #d9d9d9; }
        .btn-secondary:hover { background: #cccccc; }
        .btn-danger { background: #ff6b6b; color: white; border: 1px solid #ff6b6b; }
        .btn-danger:hover { background: #ff5252; }
        .action-btn { padding: 6px 12px; margin-right: 5px; font-size: 0.85rem; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Filter Bar */
        .filter-bar {
            background: white; border-radius: 15px; padding: 15px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px;
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        }
        .filter-bar select, .filter-bar input[type="text"] {
            padding: 10px 12px; border: 1px solid #ccc; border-radius: 15px;
            font-size: 0.95rem; min-width: 150px;
        }
        .filter-bar input[type="text"] { flex: 1; min-width: 200px; }
        .filter-bar .btn-group { display: flex; gap: 10px; margin-left: auto; }

        /* Tabel */
        .table-container {
            background: white; border-radius: 15px; padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th {
            background: #006B54; color: white; padding: 12px 15px;
            text-align: left; font-weight: 600; position: sticky; top: 0;
            white-space: nowrap;
        }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; vertical-align: middle; }
        tr:hover { background: #f9f9f9; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .text-danger { color: #dc3545; font-weight: 600; }
        .text-success { color: #28a745; font-weight: 600; }
        .text-warning { color: #ffc107; font-weight: 600; }

        /* Badge Status */
        .badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 600;
        }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .badge-danger { background: #f8d7da; color: #721c24; }
        .badge-info { background: #d1ecf1; color: #0c5460; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); align-items: center; justify-content: center;
            z-index: 1000; animation: fadeIn 0.2s ease;
        }
        .modal-overlay.show { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .modal-content {
            background: white; border-radius: 15px; max-width: 700px;
            width: 95%; max-height: 85vh; overflow-y: auto; padding: 20px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: #006B54; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .modal-header h3 { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        .close-btn {
            background: none; border: none; font-size: 1.8rem; cursor: pointer;
            color: #666; padding: 5px 10px; line-height: 1; border-radius: 50%;
        }
        .close-btn:hover { background: #f5f5f5; color: #333; }
        
        .modal-body { padding: 10px 0; }
        .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }

        /* Detail Tables in Modal */
        .detail-table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        .detail-table th { background: #f5f5f5; color: #333; padding: 10px; font-size: 0.9rem; }
        .detail-table td { padding: 10px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .detail-table .empty { text-align: center; color: #666; padding: 20px; }

        /* Notifikasi */
        .notification {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 12px 20px; border-radius: 15px; background: #006B54;
            color: white; display: none; z-index: 2000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); animation: slideDown 0.3s ease;
        }
        .notification.show { display: block; }
        .notification.error { background: #dc3545; }
        .notification.warning { background: #ffc107; color: #333; }
        .notification.success { background: #28a745; }
        @keyframes slideDown { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

        /* Loading */
        .loading-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95); z-index: 9999;
            align-items: center; justify-content: center; flex-direction: column;
        }
        .loading-overlay.show { display: flex; }
        .loading-spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3;
            border-top: 4px solid #006B54; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Empty State */
        .empty-state {
            text-align: center; padding: 60px 20px; color: #666;
        }
        .empty-state svg { width: 80px; height: 80px; margin-bottom: 20px; opacity: 0.5; }
        .empty-state .btn-primary { margin-top: 15px; }

        /* Utility */
        .hidden { display: none !important; }
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }
        .clickable { cursor: pointer; }
        .clickable:hover { background: #f0f0f0; }

        /* Responsive */
        @media (max-width: 768px) {
            .page-header { flex-direction: column; align-items: flex-start; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-bar .btn-group { margin-left: 0; justify-content: center; }
            .modal-content { width: 95%; margin: 10px; }
            .table-container { padding: 10px; }
            th, td { padding: 8px 10px; font-size: 0.85rem; }
            table { min-width: 700px; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Kembali ke Beranda">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <h1>Inventori Stok per Gudang</h1>
        <span id="user-name-display" aria-live="polite"></span>
        <button class="logout-btn" onclick="logout()" aria-label="Keluar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </button>
    </header>

    <main class="main-content">
        <div class="page-header">
            <h2>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#006B54" stroke-width="2" aria-hidden="true">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                </svg>
                Daftar Stok Gudang
            </h2>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar" role="search">
            <select id="inventory-warehouse-filter" aria-label="Filter Gudang">
                <option value="">-- Semua Gudang --</option>
            </select>
            <input type="text" id="inventory-search" placeholder="Cari produk (kode/nama)..." aria-label="Cari produk">
            <select id="inventory-stock-filter" aria-label="Filter Status Stok">
                <option value="all">Semua Stok</option>
                <option value="low">Stok Menipis (&lt; min)</option>
                <option value="zero">Stok Habis</option>
                <option value="positive">Stok &gt; 0</option>
            </select>
            <div class="btn-group">
                <button class="btn-primary" id="btn-apply-filter" onclick="applyFilters()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                    </svg>
                    Tampilkan
                </button>
                <button class="btn-secondary" onclick="resetFilters()">Reset</button>
                <button class="btn-secondary" id="btn-export-csv" onclick="exportToCSV()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Ekspor CSV
                </button>
            </div>
        </div>

        <!-- Table Container -->
        <div class="table-container" role="region" aria-live="polite">
            <div id="inventory-table-wrapper">
                <table id="inventory-table">
                    <thead>
                        <tr>
                            <th>Kode</th>
                            <th>Nama Produk</th>
                            <th>Gudang</th>
                            <th class="text-right">Stok</th>
                            <th class="text-right">Min Stok</th>
                            <th class="text-right">Max Stok</th>
                            <th class="text-right">Harga Dasar</th>
                            <th class="text-right">Nilai Stok</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table-body">
                        <tr>
                            <td colspan="9" class="text-center" style="padding: 40px;">
                                <div class="loading-spinner" style="margin: 0 auto 15px;"></div>
                                Memuat data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Summary Stats -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px;">
            <div class="table-container" style="padding: 15px;">
                <div style="font-size: 0.9rem; color: #666;">Total Item</div>
                <div style="font-size: 1.5rem; font-weight: 700; color: #006B54;" id="stat-total-items">0</div>
            </div>
            <div class="table-container" style="padding: 15px;">
                <div style="font-size: 0.9rem; color: #666;">Stok Menipis</div>
                <div style="font-size: 1.5rem; font-weight: 700; color: #ffc107;" id="stat-low-stock">0</div>
            </div>
            <div class="table-container" style="padding: 15px;">
                <div style="font-size: 0.9rem; color: #666;">Stok Habis</div>
                <div style="font-size: 1.5rem; font-weight: 700; color: #dc3545;" id="stat-zero-stock">0</div>
            </div>
            <div class="table-container" style="padding: 15px;">
                <div style="font-size: 0.9rem; color: #666;">Total Nilai Stok</div>
                <div style="font-size: 1.5rem; font-weight: 700; color: #006B54;" id="stat-total-value">Rp 0</div>
            </div>
        </div>
    </main>

    <!-- Modal Detail Batch/Serial -->
    <div id="batch-serial-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="batch-serial-modal-title">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="batch-serial-modal-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                    </svg>
                    Detail Batch / Serial
                </h3>
                <button class="close-btn" onclick="closeBatchSerialModal()" aria-label="Tutup">&times;</button>
            </div>
            <div class="modal-body" id="batch-serial-modal-body">
                <div class="text-center" style="padding: 30px;">
                    <div class="loading-spinner" style="margin: 0 auto 15px;"></div>
                    Memuat data...
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeBatchSerialModal()">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="loading-overlay" role="alert" aria-live="assertive">
        <div class="loading-spinner" aria-hidden="true"></div>
        <div style="margin-top:20px; color:#006B54;" id="loading-message">Memproses...</div>
    </div>

    <!-- Notifikasi -->
    <div id="notification" class="notification" role="alert" aria-live="assertive" aria-atomic="true"></div>

    <!-- Scripts -->
    <script>
        // ==================== FALLBACK FUNCTIONS ====================
        window.fallbackFunctions = {
            showLoading: function(message = 'Memproses...') {
                const loading = document.getElementById('loading');
                const msg = document.getElementById('loading-message');
                if (loading) {
                    if (msg) msg.textContent = message;
                    loading.classList.add('show');
                }
            },
            hideLoading: function() {
                const loading = document.getElementById('loading');
                if (loading) loading.classList.remove('show');
            },
            showNotification: function(message, type = 'info', duration = 3000) {
                const notif = document.getElementById('notification');
                if (!notif) { alert(message); return; }
                const sanitized = message.replace(/[<>]/g, '');
                notif.textContent = sanitized;
                notif.className = 'notification show';
                if (type) notif.classList.add(type);
                if (notif._timeout) clearTimeout(notif._timeout);
                notif._timeout = setTimeout(() => notif.classList.remove('show'), duration);
            }
        };
        ['showLoading', 'hideLoading', 'showNotification'].forEach(fn => {
            if (typeof window[fn] !== 'function') window[fn] = window.fallbackFunctions[fn];
        });
    </script>
    <script src="app.js" onerror="console.error('Gagal load app.js')"></script>
    <script src="inventory-core.js" onerror="console.error('Gagal load inventory-core.js')"></script>
    
    <script>
        // ==================== INVENTORY PAGE LOGIC ====================
        
        // Sanitization helper
        function sanitizeOutput(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Format Rupiah
        function formatRupiah(angka) {
            if (angka === null || angka === undefined || isNaN(angka)) return 'Rp 0';
            return 'Rp ' + Number(angka).toLocaleString('id-ID');
        }

        // Get stock status badge
        function getStockStatusBadge(stock, minStock) {
            if (stock <= 0) return '<span class="badge badge-danger">Habis</span>';
            if (stock < (minStock || 5)) return '<span class="badge badge-warning">Menipis</span>';
            return '<span class="badge badge-success">Aman</span>';
        }

        // Render warehouse filter dropdown
        function renderWarehouseFilter(selectedValue = '') {
            const select = document.getElementById('inventory-warehouse-filter');
            if (!select) return;
            
            select.innerHTML = '<option value="">-- Semua Gudang --</option>';
            
            if (!warehouses || warehouses.length === 0) {
                select.disabled = true;
                return;
            }
            
            warehouses.forEach(w => {
                if (w.isActive === false) return;
                const option = document.createElement('option');
                option.value = w.id;
                option.textContent = `${sanitizeOutput(w.code)} - ${sanitizeOutput(w.name)}`;
                if (w.id == selectedValue) option.selected = true;
                select.appendChild(option);
            });
            select.disabled = false;
        }

        // Apply filters and render table
        async function applyFilters() {
            const warehouseId = document.getElementById('inventory-warehouse-filter')?.value || '';
            const keyword = document.getElementById('inventory-search')?.value.toLowerCase().trim() || '';
            const stockFilter = document.getElementById('inventory-stock-filter')?.value || 'all';
            
            await renderInventoryTable({ warehouseId, keyword, stockFilter });
            updateStats({ warehouseId });
            
            // Save filters to sessionStorage
            try {
                sessionStorage.setItem('inventoryFilters', JSON.stringify({ warehouseId, keyword, stockFilter }));
            } catch (e) {}
        }

        // Reset filters
        function resetFilters() {
            const warehouseSelect = document.getElementById('inventory-warehouse-filter');
            const searchInput = document.getElementById('inventory-search');
            const stockFilter = document.getElementById('inventory-stock-filter');
            
            if (warehouseSelect) warehouseSelect.value = '';
            if (searchInput) searchInput.value = '';
            if (stockFilter) stockFilter.value = 'all';
            
            applyFilters();
        }

        // Render main inventory table
        async function renderInventoryTable(filters = {}) {
            const { warehouseId = '', keyword = '', stockFilter = 'all' } = filters;
            const tbody = document.getElementById('inventory-table-body');
            
            if (!tbody) return;
            
            // Show loading
            tbody.innerHTML = `
                <tr>
                    <td colspan="9" class="text-center" style="padding: 40px;">
                        <div class="loading-spinner" style="margin: 0 auto 15px;"></div>
                        Memuat data...
                    </td>
                </tr>
            `;
            
            try {
                // Ensure data is loaded
                if (!warehouses.length || !itemStocks.length) {
                    await Promise.all([loadWarehouses(), loadItemStocks(), loadItemBatches()]);
                }
                
                // Filter stocks
                let filteredStocks = [...itemStocks];
                
                if (warehouseId) {
                    filteredStocks = filteredStocks.filter(s => s.warehouseId == warehouseId);
                }
                
                // Join with items and filter by keyword
                filteredStocks = filteredStocks.map(stock => {
                    const item = kasirItems?.find(i => i.id === stock.itemId);
                    const warehouse = warehouses.find(w => w.id === stock.warehouseId);
                    return { ...stock, item, warehouse };
                }).filter(row => {
                    if (!row.item) return false;
                    
                    // Keyword filter
                    if (keyword) {
                        const matchName = row.item.name?.toLowerCase().includes(keyword);
                        const matchCode = row.item.code?.toLowerCase().includes(keyword);
                        if (!matchName && !matchCode) return false;
                    }
                    
                    // Stock filter
                    if (stockFilter === 'low') {
                        return row.quantity < (row.item.minStock || 5);
                    } else if (stockFilter === 'zero') {
                        return row.quantity <= 0;
                    } else if (stockFilter === 'positive') {
                        return row.quantity > 0;
                    }
                    return true;
                });
                
                // Sort by item name
                filteredStocks.sort((a, b) => (a.item?.name || '').localeCompare(b.item?.name || ''));
                
                // Render rows
                if (filteredStocks.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="9" class="text-center" style="padding: 40px;">
                                <div class="empty-state">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                                        <circle cx="12" cy="12" r="10"/>
                                        <line x1="12" y1="8" x2="12" y2="12"/>
                                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                                    </svg>
                                    <p>Tidak ada data yang sesuai filter.</p>
                                    <button class="btn-secondary" onclick="resetFilters()">Reset Filter</button>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }
                
                tbody.innerHTML = filteredStocks.map(row => {
                    const minStock = row.item?.minStock || 5;
                    const maxStock = row.item?.maxStock || '-';
                    const hargaDasar = row.item?.hargaDasar || 0;
                    const nilaiStok = row.quantity * hargaDasar;
                    const statusBadge = getStockStatusBadge(row.quantity, minStock);
                    
                    return `
                        <tr class="clickable" onclick="openBatchSerialDetail(${row.itemId}, ${row.warehouseId})" title="Klik untuk detail batch/serial">
                            <td><strong>${sanitizeOutput(row.item?.code || '-')}</strong></td>
                            <td>${sanitizeOutput(row.item?.name || '-')}</td>
                            <td>${sanitizeOutput(row.warehouse?.name || '-')}</td>
                            <td class="text-right ${row.quantity <= 0 ? 'text-danger' : ''}">${row.quantity}</td>
                            <td class="text-right">${minStock}</td>
                            <td class="text-right">${maxStock}</td>
                            <td class="text-right">${formatRupiah(hargaDasar)}</td>
                            <td class="text-right">${formatRupiah(nilaiStok)}</td>
                            <td class="text-center">
                                <button class="action-btn btn-secondary" onclick="event.stopPropagation(); openBatchSerialDetail(${row.itemId}, ${row.warehouseId})" title="Lihat detail">
                                    Detail
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Error rendering inventory table:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center" style="padding: 40px;">
                            <p class="text-danger">⚠️ Gagal memuat data: ${sanitizeOutput(error.message)}</p>
                            <button class="btn-primary" onclick="applyFilters()">Coba Lagi</button>
                        </td>
                    </tr>
                `;
                showNotification('Gagal memuat data: ' + error.message, 'error');
            }
        }

        // Update summary statistics
        function updateStats(filters = {}) {
            const { warehouseId = '' } = filters;
            
            let stocks = itemStocks;
            if (warehouseId) {
                stocks = stocks.filter(s => s.warehouseId == warehouseId);
            }
            
            const totalItems = stocks.length;
            const lowStock = stocks.filter(s => {
                const item = kasirItems?.find(i => i.id === s.itemId);
                return s.quantity < (item?.minStock || 5);
            }).length;
            const zeroStock = stocks.filter(s => s.quantity <= 0).length;
            const totalValue = stocks.reduce((sum, s) => {
                const item = kasirItems?.find(i => i.id === s.itemId);
                return sum + (s.quantity * (item?.hargaDasar || 0));
            }, 0);
            
            document.getElementById('stat-total-items').textContent = totalItems;
            document.getElementById('stat-low-stock').textContent = lowStock;
            document.getElementById('stat-zero-stock').textContent = zeroStock;
            document.getElementById('stat-total-value').textContent = formatRupiah(totalValue);
        }

        // Open batch/serial detail modal
        async function openBatchSerialDetail(itemId, warehouseId) {
            const modal = document.getElementById('batch-serial-modal');
            const body = document.getElementById('batch-serial-modal-body');
            const title = document.getElementById('batch-serial-modal-title');
            
            if (!modal || !body) return;
            
            const item = kasirItems?.find(i => i.id === itemId);
            const warehouse = warehouses.find(w => w.id === warehouseId);
            
            title.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                </svg>
                ${sanitizeOutput(item?.name || 'Item')} - ${sanitizeOutput(warehouse?.name || 'Gudang')}
            `;
            
            body.innerHTML = `
                <div class="text-center" style="padding: 30px;">
                    <div class="loading-spinner" style="margin: 0 auto 15px;"></div>
                    Memuat data...
                </div>
            `;
            modal.classList.add('show');
            
            try {
                const batches = getAvailableBatches(itemId, warehouseId);
                const allSerials = itemSerials.filter(s => s.itemId === itemId && s.warehouseId === warehouseId);
                const availableSerials = allSerials.filter(s => s.status === 'available');
                
                let html = '';
                
                // Batches section
                if (batches.length > 0) {
                    html += `
                        <h4 style="margin: 20px 0 10px; color: #006B54;">📦 Batch (${batches.length})</h4>
                        <table class="detail-table">
                            <thead>
                                <tr>
                                    <th>Kode Batch</th>
                                    <th>Exp Date</th>
                                    <th class="text-right">Stok</th>
                                    <th class="text-right">Harga Beli</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${batches.map(b => `
                                    <tr>
                                        <td><strong>${sanitizeOutput(b.batchNumber)}</strong></td>
                                        <td>${b.expiryDate ? new Date(b.expiryDate).toLocaleDateString('id-ID') : '-'}</td>
                                        <td class="text-right ${b.quantity <= 0 ? 'text-danger' : ''}">${b.quantity}</td>
                                        <td class="text-right">${formatRupiah(b.purchasePrice || 0)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }
                
                // Serials section (if item tracks serial)
                if (item?.trackSerial && allSerials.length > 0) {
                    html += `
                        <h4 style="margin: 20px 0 10px; color: #006B54;">🔢 Serial Number (${availableSerials.length} tersedia)</h4>
                        <table class="detail-table">
                            <thead>
                                <tr>
                                    <th>Serial</th>
                                    <th>Status</th>
                                    <th>Batch</th>
                                    <th class="text-right">Harga Beli</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${allSerials.slice(0, 50).map(s => {
                                    const batch = itemBatches.find(b => b.id === s.batchId);
                                    return `
                                        <tr>
                                            <td><strong>${sanitizeOutput(s.serialNumber)}</strong></td>
                                            <td>
                                                <span class="badge ${
                                                    s.status === 'available' ? 'badge-success' :
                                                    s.status === 'sold' ? 'badge-info' : 'badge-danger'
                                                }">${s.status}</span>
                                            </td>
                                            <td>${sanitizeOutput(batch?.batchNumber || '-')}</td>
                                            <td class="text-right">${formatRupiah(s.purchasePrice || 0)}</td>
                                        </tr>
                                    `;
                                }).join('')}
                                ${allSerials.length > 50 ? `<tr><td colspan="4" class="text-center text-warning">... dan ${allSerials.length - 50} serial lainnya</td></tr>` : ''}
                            </tbody>
                        </table>
                    `;
                }
                
                if (batches.length === 0 && (!item?.trackSerial || allSerials.length === 0)) {
                    html += `
                        <div class="empty-state" style="padding: 30px;">
                            <p>Tidak ada data batch atau serial untuk item ini.</p>
                        </div>
                    `;
                }
                
                body.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading batch/serial detail:', error);
                body.innerHTML = `
                    <div class="text-center" style="padding: 30px;">
                        <p class="text-danger">Gagal memuat detail: ${sanitizeOutput(error.message)}</p>
                    </div>
                `;
            }
        }

        // Close batch/serial modal
        function closeBatchSerialModal() {
            const modal = document.getElementById('batch-serial-modal');
            if (modal) modal.classList.remove('show');
        }

        // Export to CSV
        function exportToCSV() {
            const warehouseId = document.getElementById('inventory-warehouse-filter')?.value || '';
            const keyword = document.getElementById('inventory-search')?.value.toLowerCase().trim() || '';
            
            let data = itemStocks.map(stock => {
                const item = kasirItems?.find(i => i.id === stock.itemId);
                const warehouse = warehouses.find(w => w.id === stock.warehouseId);
                if (!item) return null;
                
                // Apply filters
                if (warehouseId && stock.warehouseId != warehouseId) return null;
                if (keyword) {
                    const matchName = item.name?.toLowerCase().includes(keyword);
                    const matchCode = item.code?.toLowerCase().includes(keyword);
                    if (!matchName && !matchCode) return null;
                }
                
                return {
                    Kode: item.code || '',
                    'Nama Produk': item.name || '',
                    Gudang: warehouse?.name || '',
                    Stok: stock.quantity,
                    'Min Stok': item.minStock || 5,
                    'Max Stok': item.maxStock || '',
                    'Harga Dasar': item.hargaDasar || 0,
                    'Nilai Stok': stock.quantity * (item.hargaDasar || 0)
                };
            }).filter(row => row !== null);
            
            if (data.length === 0) {
                showNotification('Tidak ada data untuk diekspor', 'warning');
                return;
            }
            
            // Generate CSV
            const headers = Object.keys(data[0]);
            const csv = [
                headers.join(','),
                ...data.map(row => headers.map(h => {
                    const val = row[h];
                    // Escape quotes and wrap in quotes if contains comma
                    const escaped = String(val).replace(/"/g, '""');
                    return `"${escaped}"`;
                }).join(','))
            ].join('\n');
            
            // Download
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `inventory-${new Date().toISOString().split('T')[0]}.csv`;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            showNotification(`Berhasil ekspor ${data.length} baris`, 'success');
        }

        // Modal keyboard handling
        function setupModalKeyboard() {
            const modal = document.getElementById('batch-serial-modal');
            if (!modal) return;
            
            modal.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    closeBatchSerialModal();
                }
            });
            
            // Click outside to close
            modal.addEventListener('click', function(e) {
                if (e.target === modal) closeBatchSerialModal();
            });
        }

        // Initialize page
        async function initInventoryPage() {
            try {
                // Wait for dependencies
                if (typeof db === 'undefined' || !db || !warehouses) {
                    await new Promise(resolve => {
                        const check = setInterval(() => {
                            if (typeof db !== 'undefined' && db && warehouses) {
                                clearInterval(check);
                                resolve();
                            }
                        }, 100);
                        setTimeout(() => { clearInterval(check); resolve(); }, 5000);
                    });
                }
                
                // Show user name
                try {
                    const savedUser = sessionStorage.getItem('currentUser');
                    if (savedUser) {
                        const parsed = JSON.parse(savedUser);
                        const nameDisplay = document.getElementById('user-name-display');
                        if (nameDisplay) {
                            nameDisplay.textContent = sanitizeOutput(parsed.name || parsed.username || 'User');
                        }
                    }
                } catch (e) {}
                
                // Setup modal handlers
                setupModalKeyboard();
                
                // Render warehouse filter
                renderWarehouseFilter();
                
                // Load saved filters
                try {
                    const saved = sessionStorage.getItem('inventoryFilters');
                    if (saved) {
                        const filters = JSON.parse(saved);
                        if (filters.warehouseId) {
                            document.getElementById('inventory-warehouse-filter').value = filters.warehouseId;
                        }
                        if (filters.keyword) {
                            document.getElementById('inventory-search').value = filters.keyword;
                        }
                        if (filters.stockFilter) {
                            document.getElementById('inventory-stock-filter').value = filters.stockFilter;
                        }
                    }
                } catch (e) {}
                
                // Initial render
                await applyFilters();
                
                console.log('Inventory page initialized');
                
            } catch (error) {
                console.error('Error init inventory page:', error);
                const tbody = document.getElementById('inventory-table-body');
                if (tbody) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="9" class="text-center" style="padding: 40px;">
                                <p class="text-danger">⚠️ Gagal memuat halaman: ${sanitizeOutput(error.message)}</p>
                                <button class="btn-primary" onclick="initInventoryPage()">Coba Lagi</button>
                            </td>
                        </tr>
                    `;
                }
                showNotification('Gagal memuat halaman: ' + error.message, 'error');
            }
        }

        // Cleanup on unload
        function cleanupPage() {
            const modal = document.getElementById('batch-serial-modal');
            if (modal) {
                modal.removeEventListener('keydown', null);
                modal.removeEventListener('click', null);
            }
        }
        window.addEventListener('beforeunload', cleanupPage);

        // Auto-refresh on visibility change
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                applyFilters();
            }
        });

        // Run on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initInventoryPage);
        } else {
            initInventoryPage();
        }

        // Expose for debugging
        window.inventoryDebug = {
            initInventoryPage,
            applyFilters,
            resetFilters,
            exportToCSV,
            openBatchSerialDetail,
            sanitizeOutput
        };
    </script>
</body>
