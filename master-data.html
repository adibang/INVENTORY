<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUDA - Master Data</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ==================== RESET & BASE STYLES ==================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    background: #FFFFFF;
    min-height: 100vh;
    color: #333333;
}
/* ==================== HEADER ==================== */
.app-header {
    background: #FFFFFF;
    color: #006B54;
    padding: 16px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 100;
}
.header-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.app-title {
    font-size: 1.2rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #006B54;
}
.drawer-toggle {
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    margin-right: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #006B54;
}
.drawer-toggle svg {
    width: 24px;
    height: 24px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
}
.header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
}
.header-actions button {
    background: #FFFFFF;
    color: #006B54;
    padding: 8px 12px;
    border-radius: 15px;
    border: 1px solid #006B54;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
}
.header-actions button:hover {
    background: #006B54;
    color: white;
}
.header-actions button svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    display: block;
}
#user-name-display {
    margin-right: 10px;
    font-weight: 600;
    color: #006B54;
}
/* ==================== DRAWER SIDEBAR ==================== */
.sidebar {
    position: fixed;
    left: -220px;
    top: 0;
    width: 220px;
    height: 100vh;
    background: #ffffff;
    box-shadow: 2px 0 8px rgba(0,0,0,0.1);
    z-index: 300;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
    overflow-y: auto;
    transition: left 0.3s ease;
}
.sidebar.open {
    left: 0;
}
.menu-group {
    margin-bottom: 5px;
}
.menu-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background-color: #f5f5f5;
    cursor: pointer;
    border-radius: 8px;
    margin: 0 10px 5px;
    font-weight: 700;
    color: #006B54;
}
.menu-header .arrow {
    transition: transform 0.2s;
}
.menu-header.open .arrow {
    transform: rotate(90deg);
}
.sub-menu {
    display: none;
    margin-bottom: 10px;
}
.sub-menu button {
    margin: 5px 10px;
    padding: 12px 16px;
    border: 1px solid #006B54;
    border-radius: 15px;
    background: white;
    color: #006B54;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.2s;
    width: calc(100% - 20px);
}
.sub-menu button:hover {
    background: #f0f9f6;
}
.sub-menu button svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
}
.drawer-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 250;
    display: none;
}
.drawer-overlay.show {
    display: block;
}
/* ==================== MAIN CONTENT ==================== */
.main-content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px;
}
.content-card {
    background: white;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.page-title {
    color: #006B54;
    font-size: 1.5rem;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: space-between;
}
.back-button {
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #006B54;
    border-radius: 15px;
}
.back-button:hover {
    background: #f0f9f6;
}
.back-button svg {
    width: 24px;
    height: 24px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
}
/* ==================== FORM STYLES ==================== */
.form-group {
    margin-bottom: 15px;
}
.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: 500;
    color: #333;
}
.form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #333;
    border-radius: 15px;
    font-size: 1rem;
    background: white;
    color: #333;
    transition: all 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: #006B54;
    outline: none;
    box-shadow: 0 0 0 3px rgba(0,107,84,0.1);
}
.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 15px;
}
.form-button-primary {
    background: #006B54;
    color: white;
    border: 1px solid #006B54;
    padding: 12px 16px;
    border-radius: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}
.form-button-primary:hover {
    background: #005a46;
}
.form-button-secondary {
    background: #d9d9d9;
    color: #333333;
    border: 1px solid #d9d9d9;
    padding: 12px 16px;
    border-radius: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}
.form-button-secondary:hover {
    background: #cccccc;
}
/* ==================== TABLE STYLES ==================== */
.table-responsive {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-top: 15px;
}
.data-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
}
.data-table th {
    background: #f5f5f5;
    padding: 12px;
    text-align: left;
    font-weight: 600;
    color: #333;
    white-space: nowrap;
}
.data-table td {
    padding: 12px;
    border-bottom: 1px solid #eee;
    white-space: nowrap;
}
.data-table tr:hover {
    background: #f9f9f9;
}
.action-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid #006B54;
    background: white;
    color: #006B54;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    margin-right: 5px;
}
.action-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
}
.action-btn.delete-btn {
    border-color: #ff6b6b;
    color: #ff6b6b;
}
.action-btn.delete-btn:hover {
    background: #ff6b6b;
    color: white;
}
.action-btn.edit-btn:hover {
    background: #006B54;
    color: white;
}
/* ==================== SEARCH BOX ==================== */
.search-box {
    margin-bottom: 15px;
}
/* ==================== MODAL OVERLAY ==================== */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 15px;
}
.modal-content {
    background: #FFFFFF;
    border-radius: 15px;
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}
.modal-header {
    padding: 12px 20px;
    color: #006B54;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    border-bottom: 1px solid rgba(0, 107, 84, 0.1);
}
.modal-title {
    font-size: 1rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #006B54;
}
.modal-body {
    padding: 20px;
    max-height: calc(90vh - 60px);
    overflow-y: auto;
}
.modal-footer {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    padding: 15px 20px;
    border-top: 1px solid #eee;
    background: #fafafa;
}
/* ==================== LIST ITEM UNTUK MODAL ==================== */
.item-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
}
.item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f9f9f9;
    border: 1px solid #ddd;
    border-radius: 15px;
    padding: 12px 15px;
}
.item-info {
    flex: 1;
    min-width: 0;
}
.item-name {
    font-weight: 600;
    font-size: 1rem;
    color: #006B54;
    margin-bottom: 4px;
}
.item-details {
    font-size: 0.8rem;
    color: #666;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}
.item-details span {
    white-space: nowrap;
}
.item-code, .item-barcode {
    background: #eaeaea;
    padding: 2px 8px;
    border-radius: 12px;
}
.select-btn {
    background: #006B54;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 10px;
    white-space: nowrap;
    transition: background 0.2s;
}
.select-btn:hover {
    background: #004d3e;
}
/* ==================== KONVERSI SATUAN & LEVEL HARGA ==================== */
.conversions-section, .level-harga-container {
    margin-top: 15px;
}
#add-conversion-btn {
    width: 100%;
    padding: 12px;
    border: 2px dashed #006B54;
    border-radius: 15px;
    background: white;
    color: #006B54;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
    cursor: pointer;
}
#add-conversion-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
}
.conversions-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.conversion-item {
    background: #f9f9f9;
    border: 1px solid #d9d9d9;
    border-radius: 15px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.conversion-info {
    flex: 1;
}
.conversion-actions {
    display: flex;
    gap: 5px;
}
.conversion-item .action-btn svg {
    width: 16px;
    height: 16px;
}
.level-harga-item {
    display: grid;
    grid-template-columns: 60px 1fr 1fr 36px;
    gap: 10px;
    margin-bottom: 10px;
    align-items: center;
}
.level-harga-item .level-number {
    font-weight: 600;
    color: #006B54;
    white-space: nowrap;
}
.level-harga-item .form-input {
    width: 100%;
    min-width: 0;
}
.level-harga-remove {
    background: #ff6b6b;
    color: white;
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    cursor: pointer;
    font-size: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 0;
    transition: background 0.2s;
}
.level-harga-remove:hover {
    background: #ff4c4c;
}
.btn-add-level {
    background: #006B54;
    color: white;
    border: none;
    border-radius: 15px;
    padding: 10px 16px;
    margin-top: 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}
.btn-add-level svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
}
/* ==================== BOM COMPONENT ROW ==================== */
.bom-component-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    align-items: center;
}
.bom-component-row select,
.bom-component-row input {
    flex: 1;
}
/* ==================== NOTIFICATION ==================== */
#notification {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    border-radius: 15px;
    display: none;
    color: white;
    background-color: #006B54;
    max-width: 90%;
    text-align: center;
    z-index: 1001;
    font-size: 14px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}
/* Loading spinner */
.loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(0,107,84,0.3);
    border-radius: 50%;
    border-top-color: #006B54;
    animation: spin 1s ease-in-out infinite;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<!-- ==================== HEADER ==================== -->
<header class="app-header">
    <div class="header-content">
        <div class="app-title">
            <button class="drawer-toggle" id="drawer-toggle" onclick="toggleDrawer()">
                <svg viewBox="0 0 24 24">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                <line x1="12" y1="22.08" x2="12" y2="12"/>
            </svg>
            <span>Master Data</span>
        </div>
        <div class="header-actions">
            <span id="user-name-display"></span>
            <button onclick="window.location.href='index.html'">
                <svg viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </button>
            <button onclick="logout()">
                <svg viewBox="0 0 24 24">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </div>
</header>

<!-- ==================== SIDEBAR DRAWER ==================== -->
<div class="sidebar" id="sidebar">
    <!-- Grup ITEM -->
    <div class="menu-group" id="menu-master">
        <div class="menu-header" onclick="toggleSubMenu(this)">
            <span>ITEM</span>
            <span class="arrow">></span>
        </div>
        <div class="sub-menu">
            <button onclick="navigateTo('addItem'); closeDrawer()">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                <span>Tambah Item</span>
            </button>
            <button onclick="navigateTo('listItems'); closeDrawer()">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                </svg>
                <span>Daftar Item</span>
            </button>
        </div>
    </div>
    <!-- Grup KATEGORI -->
    <div class="menu-group" id="menu-kategori">
        <div class="menu-header" onclick="toggleSubMenu(this)">
            <span>KATEGORI</span>
            <span class="arrow">></span>
        </div>
        <div class="sub-menu">
            <button onclick="navigateTo('addCategory'); closeDrawer()">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                <span>Tambah Kategori</span>
            </button>
            <button onclick="navigateTo('listCategories'); closeDrawer()">
                <svg viewBox="0 0 24 24">
                    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
                    <path d="M10 2v20"/>
                </svg>
                <span>Daftar Kategori</span>
            </button>
        </div>
    </div>
    <!-- Grup SATUAN -->
    <div class="menu-group" id="menu-satuan">
        <div class="menu-header" onclick="toggleSubMenu(this)">
            <span>SATUAN</span>
            <span class="arrow">></span>
        </div>
        <div class="sub-menu">
            <button onclick="navigateTo('addUnit'); closeDrawer()">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                <span>Tambah Satuan</span>
            </button>
            <button onclick="navigateTo('listUnits'); closeDrawer()">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="9" y1="21" x2="9" y2="9"/>
                </svg>
                <span>Daftar Satuan</span>
            </button>
        </div>
    </div>
    <!-- Grup BUNDLE -->
    <div class="menu-group" id="menu-bundle">
        <div class="menu-header" onclick="toggleSubMenu(this)">
            <span>BUNDLE</span>
            <span class="arrow">></span>
        </div>
        <div class="sub-menu">
            <button onclick="navigateTo('addBundle'); closeDrawer()">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                <span>Tambah Bundle</span>
            </button>
            <button onclick="navigateTo('listBundles'); closeDrawer()">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                </svg>
                <span>Daftar Bundle</span>
            </button>
        </div>
    </div>
    <!-- Grup BOM (Bill of Materials) -->
    <div class="menu-group" id="menu-bom">
        <div class="menu-header" onclick="toggleSubMenu(this)">
            <span>BOM</span>
            <span class="arrow">></span>
        </div>
        <div class="sub-menu">
            <button onclick="navigateTo('addBOM'); closeDrawer()">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                <span>Tambah BOM</span>
            </button>
            <button onclick="navigateTo('listBOMs'); closeDrawer()">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                </svg>
                <span>Daftar BOM</span>
            </button>
        </div>
    </div>
</div>
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>

<!-- ==================== KONTEN UTAMA ==================== -->
<main class="main-content" id="master-content">
    <!-- Diisi oleh JavaScript -->
</main>

<!-- ==================== MODAL KONVERSI SATUAN ==================== -->
<div class="modal-overlay" id="conversion-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title" id="conversion-modal-title">Tambah Konversi Satuan</h2>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Satuan</label>
                <select id="conv-unit" class="form-input" required>
                    <option value="">-- Pilih Satuan --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Nilai Satuan (berapa unit dasar per satuan ini)</label>
                <input type="number" id="conv-value" class="form-input" min="0.01" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Barcode Satuan</label>
                <input type="text" id="conv-barcode" class="form-input">
            </div>
            <div class="form-group">
                <label>SKU (Opsional)</label>
                <input type="text" id="conv-sku" class="form-input">
            </div>
            <div class="form-group">
                <label>Harga Dasar</label>
                <input type="number" id="conv-base-price" class="form-input" min="0" step="0.01">
            </div>
            <div class="form-group">
                <label>Harga Jual</label>

function toggleSubMenu(header) {

// ==================== DATABASE FUNCTIONS ====================
async function initDatabase() {
    return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
            reject('Browser tidak mendukung IndexedDB.');
            return;
        }
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = (e) => reject(e.target.error);
        request.onsuccess = (e) => {
            db = e.target.result;
            resolve();
        };
        request.onupgradeneeded = (e) => {
            const db = e.target.result;
            const tx = e.target.transaction;
            
            if (!db.objectStoreNames.contains(STORES.SETTINGS)) {
                db.createObjectStore(STORES.SETTINGS, { keyPath: 'key' });
            }
            if (!db.objectStoreNames.contains(STORES.KASIR_CATEGORIES)) {
                const catStore = db.createObjectStore(STORES.KASIR_CATEGORIES, { keyPath: 'id', autoIncrement: true });
                catStore.createIndex('name', 'name', { unique: true });
            }
            if (!db.objectStoreNames.contains(STORES.KASIR_ITEMS)) {
                const itemStore = db.createObjectStore(STORES.KASIR_ITEMS, { keyPath: 'id', autoIncrement: true });
                itemStore.createIndex('code', 'code', { unique: true });
            }
            if (!db.objectStoreNames.contains(STORES.KASIR_SATUAN)) {
                const satuanStore = db.createObjectStore(STORES.KASIR_SATUAN, { keyPath: 'id', autoIncrement: true });
                satuanStore.createIndex('name', 'name', { unique: true });
            }
            if (!db.objectStoreNames.contains(STORES.CUSTOMERS)) {
                db.createObjectStore(STORES.CUSTOMERS, { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains(STORES.SUPPLIERS)) {
                db.createObjectStore(STORES.SUPPLIERS, { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains(STORES.PENDING_TRANSACTIONS)) {
                db.createObjectStore(STORES.PENDING_TRANSACTIONS, { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains(STORES.SALES)) {
                const salesStore = db.createObjectStore(STORES.SALES, { keyPath: 'id', autoIncrement: true });
                salesStore.createIndex('date', 'date', { unique: false });
            }
            if (!db.objectStoreNames.contains(STORES.PURCHASES)) {
                const purchaseStore = db.createObjectStore(STORES.PURCHASES, { keyPath: 'id', autoIncrement: true });
                purchaseStore.createIndex('date', 'date', { unique: false });
            }
            if (!db.objectStoreNames.contains(STORES.USERS)) {
                const userStore = db.createObjectStore(STORES.USERS, { keyPath: 'id', autoIncrement: true });
                userStore.createIndex('username', 'username', { unique: true });
            }
            if (!db.objectStoreNames.contains(STORES.ROLES)) {
                const roleStore = db.createObjectStore(STORES.ROLES, { keyPath: 'id', autoIncrement: true });
                roleStore.createIndex('name', 'name', { unique: true });
            }
            if (!db.objectStoreNames.contains(STORES.BUNDLES)) {
                db.createObjectStore(STORES.BUNDLES, { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains(STORES.BILL_OF_MATERIALS)) {
                const bomStore = db.createObjectStore(STORES.BILL_OF_MATERIALS, { keyPath: 'id', autoIncrement: true });
                bomStore.createIndex('product_id', 'product_id', { unique: true });
            }
        };
    });
}

async function dbGetAll(storeName) {
    return new Promise((resolve, reject) => {
        if (!db) { reject('DB not init'); return; }
        const tx = db.transaction([storeName], 'readonly');
        const store = tx.objectStore(storeName);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = (e) => reject(e.target.error);
    });
}

async function dbGet(storeName, key) {
    return new Promise((resolve, reject) => {
        if (!db) { reject('DB not init'); return; }
        const tx = db.transaction([storeName], 'readonly');
        const store = tx.objectStore(storeName);
        const request = store.get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = (e) => reject(e.target.error);
    });
}

async function dbAdd(storeName, data) {
    return new Promise((resolve, reject) => {
        if (!db) { reject('DB not init'); return; }
        const tx = db.transaction([storeName], 'readwrite');
        const store = tx.objectStore(storeName);
        const request = store.add(data);
        request.onsuccess = () => resolve(request.result);
        request.onerror = (e) => reject(e.target.error);
    });
}

async function dbPut(storeName, data) {
    return new Promise((resolve, reject) => {
        if (!db) { reject('DB not init'); return; }
        const tx = db.transaction([storeName], 'readwrite');
        const store = tx.objectStore(storeName);
        const request = store.put(data);
        request.onsuccess = () => resolve(request.result);
        request.onerror = (e) => reject(e.target.error);
    });
}

async function dbDelete(storeName, key) {
    return new Promise((resolve, reject) => {
        if (!db) { reject('DB not init'); return; }
        const tx = db.transaction([storeName], 'readwrite');
        const store = tx.objectStore(storeName);
        const request = store.delete(key);
        request.onsuccess = () => resolve();
        request.onerror = (e) => reject(e.target.error);
    });
}

async function getBOMByProductId(productId) {
    try {
        const tx = db.transaction([STORES.BILL_OF_MATERIALS], 'readonly');
        const store = tx.objectStore(STORES.BILL_OF_MATERIALS);
        const index = store.index('product_id');
        const range = IDBKeyRange.only(productId);
        const request = index.get(range);
        return new Promise((resolve, reject) => {
            request.onsuccess = () => resolve(request.result);
            request.onerror = reject;
        });
    } catch (error) {
        console.error('Error getBOMByProductId:', error);
        return null;
    }
}

async function saveBOM(bomData, id = null) {
    const now = new Date().toISOString();
    if (id) {
        const existing = await dbGet(STORES.BILL_OF_MATERIALS, id);
        if (!existing) throw new Error('BOM tidak ditemukan');
        const updated = { ...existing, ...bomData, updatedAt: now };
        await dbPut(STORES.BILL_OF_MATERIALS, updated);
        return updated;
    } else {
        const existing = await getBOMByProductId(bomData.product_id);
        if (existing) throw new Error('Produk ini sudah memiliki BOM');
        const newBOM = { ...bomData, createdAt: now, updatedAt: now };
        const newId = await dbAdd(STORES.BILL_OF_MATERIALS, newBOM);
        newBOM.id = newId;
        return newBOM;
    }
}

async function deleteBOM(id) {
    await dbDelete(STORES.BILL_OF_MATERIALS, id);
}

async function addBOMComponentRow(itemId = '', qty = 1, unitConvId = '') {
    const container = document.getElementById('bom-components-container');
    const items = kasirItems;
    let itemOptions = '<option value="">-- Pilih Item --</option>';
    items.forEach(it => {
        itemOptions += `<option value="${it.id}" ${it.id == itemId ? 'selected' : ''}>${it.code} - ${it.name}</option>`;
    });
    const row = document.createElement('div');
    row.className = 'bom-component-row';
    row.innerHTML = `
        <select class="form-input component-item" style="flex:2;" onchange="updateUnitOptions(this)">
            ${itemOptions}
        </select>
        <input type="number" class="form-input component-qty" style="flex:1;" value="${qty}" min="0.01" step="0.01">
        <select class="form-input component-unit" style="flex:1;">
            <option value="">Tanpa Satuan</option>
        </select>
        <button type="button" class="level-harga-remove" onclick="this.closest('.bom-component-row').remove()">×</button>
    `;
    container.appendChild(row);
    if (itemId) {
        const item = items.find(i => i.id == itemId);
        if (item && item.unitConversions) {
            const unitSelect = row.querySelector('.component-unit');
            const satuan = kasirSatuan;
            item.unitConversions.forEach(conv => {
                const convId = conv.id || `temp-${Math.random()}`;
                const unitName = satuan.find(s => s.id == conv.unit)?.name || '?';
                unitSelect.innerHTML += `<option value="${convId}" ${convId == unitConvId ? 'selected' : ''}>${unitName} (${conv.value})</option>`;
            });
        }
    }
}

async function updateUnitOptions(select) {
    const itemId = select.value;
    const row = select.closest('.bom-component-row');
    const unitSelect = row.querySelector('.component-unit');
    unitSelect.innerHTML = '<option value="">Tanpa Satuan</option>';
    if (!itemId) return;
    const items = kasirItems;
    const item = items.find(i => i.id == itemId);
    if (item && item.unitConversions) {
        const satuan = kasirSatuan;
        item.unitConversions.forEach(conv => {
            const convId = conv.id || `temp-${Math.random()}`;
            const unitName = satuan.find(s => s.id == conv.unit)?.name || '?';
            unitSelect.innerHTML += `<option value="${convId}">${unitName} (${conv.value})</option>`;
        });
    }
}

function collectBOMComponents() {
    const rows = document.querySelectorAll('.bom-component-row');
    const components = [];
    rows.forEach(row => {
        const itemId = row.querySelector('.component-item').value;
        const qty = parseFloat(row.querySelector('.component-qty').value);
        const unitConvId = row.querySelector('.component-unit').value;
        if (itemId && qty > 0) {
            components.push({
                item_id: parseInt(itemId),
                quantity: qty,
                unit_conversion_id: unitConvId && !unitConvId.startsWith('temp') ? parseInt(unitConvId) : null
            });
        }
    });
    return components;
}

async function saveBOMFromPage() {
    const productId = parseInt(document.getElementById('bom-product').value);
    if (!productId) {
        showNotification('Pilih produk jadi', 'error');
        return;
    }
    const components = collectBOMComponents();
    if (components.length === 0) {
        showNotification('Minimal satu komponen harus diisi', 'error');
        return;
    }
    try {
        if (editingBOMId) {
            await saveBOM({ product_id: productId, components }, editingBOMId);
        } else {
            await saveBOM({ product_id: productId, components });
        }
        showNotification('BOM berhasil disimpan', 'success');
        navigateTo('listBOMs');
    } catch (error) {
        showNotification('Gagal menyimpan: ' + error.message, 'error');
    }
}

async function viewBOM(id) {
    try {
        const boms = await loadBOMs();
        const bom = boms.find(b => b.id === id);
        if (!bom) return;
        const product = kasirItems.find(i => i.id === bom.product_id);
        let html = `<h3>${product ? product.name : 'Produk'}</h3>`;
        html += '<table class="data-table"><thead><tr><th>Komponen</th><th>Jumlah</th><th>Satuan</th></tr></thead><tbody>';
        for (let comp of bom.components) {
            const compItem = kasirItems.find(i => i.id === comp.item_id);
            const compName = compItem ? compItem.name : 'Unknown';
            let unitText = '';
            if (comp.unit_conversion_id && compItem && compItem.unitConversions) {
                const conv = compItem.unitConversions.find(u => u.id == comp.unit_conversion_id);
                if (conv) {
                    const unitName = kasirSatuan.find(s => s.id == conv.unit)?.name || '?';
                    unitText = `${unitName} (${conv.value} ${compItem.satuanDasar || 'pcs'})`;
                }
            }
            html += `<tr><td>${compName}</td><td>${comp.quantity}</td><td>${unitText || '-'}</td></tr>`;
        }
        html += '</tbody></table>';

async function saveCategoryFromPage() {
    const name = document.getElementById('category-name').value.trim();
    const description = document.getElementById('category-description').value.trim();
    
    if (!name) {
        showNotification('Nama kategori harus diisi', 'error');
        return;
    }
    
    // Cek duplikat KECUALI untuk record yang sedang diedit
    const duplicate = kasirCategories.find(c => 
        c.name.toLowerCase() === name.toLowerCase() && 
        c.id !== editingCategoryId
    );
    
    if (duplicate) {
        showNotification('Nama kategori sudah digunakan', 'error');
        return;
    }
    
    try {
        if (editingCategoryId) {
            // MODE EDIT - Update data existing
            const cat = await dbGet(STORES.KASIR_CATEGORIES, editingCategoryId);
            if (!cat) throw new Error('Kategori tidak ditemukan');
            cat.name = name;
            cat.description = description;
            cat.updatedAt = new Date().toISOString();
            await dbPut(STORES.KASIR_CATEGORIES, cat);
        } else {
            // MODE TAMBAH - Create data baru
            const newCat = {
                name,
                description,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            await dbAdd(STORES.KASIR_CATEGORIES, newCat);
        }
        
        await loadKasirCategories();
        showNotification('Kategori disimpan', 'success');
        navigateTo('listCategories');
    } catch (error) {
        showNotification('Gagal menyimpan: ' + error.message, 'error');
    }
}

    // tidak perlu aksi

function collectBundleItems() {
    const rows = document.querySelectorAll('#bundle-items-container .bom-component-row');
    const items = [];
    rows.forEach(row => {
        const itemId = parseInt(row.querySelector('.bundle-item-id').value);
        const qty = parseFloat(row.querySelector('input[type=number]').value);
        if (itemId && qty > 0) {
            items.push({ itemId, quantity: qty });
        }
    });
    return items;
}

async function saveBundleFromPage() {
    const name = document.getElementById('bundle-name').value.trim();
    const price = parseFloat(document.getElementById('bundle-price').value) || null;
    const description = document.getElementById('bundle-description').value.trim();
    const items = collectBundleItems();
    
    if (!name) {
        showNotification('Nama bundle harus diisi', 'error');
        return;
    }
    if (items.length === 0) {
        showNotification('Bundle harus memiliki minimal satu item', 'error');
        return;
    }
    
    try {
        const now = new Date().toISOString();
        if (editingBundleId) {
            // MODE EDIT - Update data existing
            const bundle = bundles.find(b => b.id === editingBundleId);
            if (bundle) {
                bundle.name = name;
                bundle.price = price;
                bundle.description = description;
                bundle.items = items;
                bundle.updatedAt = now;
                await dbPut(STORES.BUNDLES, bundle);
            }
        } else {
            // MODE TAMBAH - Create data baru
            const newBundle = {
                name,
                price,
                description,
                items,
                createdAt: now,
                updatedAt: now
            };
            await dbAdd(STORES.BUNDLES, newBundle);
        }
        
        await loadBundles();
        showNotification('Bundle disimpan', 'success');
        navigateTo('listBundles');

        showNotification('Gagal menyimpan: ' + error.message, 'error');

function showEditItemPage(itemId) {
    const item = kasirItems.find(i => i.id === itemId);
    if (!item) {
        showNotification('Item tidak ditemukan', 'error');
        navigateTo('listItems');
        return;
    }
    editingItemId = itemId;
    tempUnitConversions = item.unitConversions ? JSON.parse(JSON.stringify(item.unitConversions)) : [];
    tempUnitConversions = tempUnitConversions.map((conv, idx) => {
        if (!conv.id) conv.id = idx + 1;
        return conv;
    });
    showAddItemPage();
    setTimeout(() => {
        document.getElementById('kasir-item-name').value = item.name || '';
        document.getElementById('kasir-item-code').value = item.code || '';
        document.getElementById('kasir-item-barcode').value = item.barcode || item.code || '';
        document.getElementById('kasir-item-category').value = item.categoryId || '';
        document.getElementById('kasir-item-harga-dasar').value = item.hargaDasar || '';
        document.getElementById('kasir-item-harga-jual').value = item.hargaJual || '';
        document.getElementById('kasir-item-berat').value = item.berat || '';
        document.getElementById('kasir-item-satuan').value = item.satuanId || '';
        document.getElementById('kasir-item-diskon').value = item.diskon || '';
        document.getElementById('kasir-item-stock').value = item.stock || 0;
        document.getElementById('kasir-item-min-stock').value = item.minStock || 5;
        document.getElementById('kasir-item-weighable').checked = item.isWeighable || false;
        document.getElementById('kasir-item-track-batch').checked = item.track_batch || false;
        document.getElementById('kasir-item-track-serial').checked = item.track_serial || false;
        const levelContainer = document.getElementById('level-harga-container');
        levelContainer.innerHTML = '';
        if (item.priceLevels && item.priceLevels.length > 0) {
            item.priceLevels.forEach(l => addLevelRow(l.minQty, l.price));
        } else {
            addLevelRow();
        }
        renderConversionsList();
    }, 0);
}

// ==================== FUNGSI SAVE ITEM (DIPERBAIKI) ====================
async function saveKasirItemFromPage() {
    // Pastikan editingItemId dalam format number
    if (editingItemId) {
        editingItemId = Number(editingItemId);
    }
    
    const name = document.getElementById('kasir-item-name').value.trim();
    const code = document.getElementById('kasir-item-code').value.trim();
    const barcode = document.getElementById('kasir-item-barcode').value.trim() || code;
    const categoryId = document.getElementById('kasir-item-category').value ? parseInt(document.getElementById('kasir-item-category').value) : null;
    const hargaDasar = parseFloat(document.getElementById('kasir-item-harga-dasar').value) || null;
    const hargaJual = parseFloat(document.getElementById('kasir-item-harga-jual').value) || null;
    const berat = parseFloat(document.getElementById('kasir-item-berat').value) || null;
    const satuanId = document.getElementById('kasir-item-satuan').value ? parseInt(document.getElementById('kasir-item-satuan').value) : null;
    const diskon = parseFloat(document.getElementById('kasir-item-diskon').value) || null;
    const stock = parseFloat(document.getElementById('kasir-item-stock').value) || 0;
    const minStock = parseFloat(document.getElementById('kasir-item-min-stock').value) || 5;
    const isWeighable = document.getElementById('kasir-item-weighable').checked;
    const track_batch = document.getElementById('kasir-item-track-batch').checked;
    const track_serial = document.getElementById('kasir-item-track-serial').checked;
    const priceLevels = getPriceLevelsFromDOM();
    
    if (!name || !code) {
        showNotification('Nama dan kode harus diisi!', 'error');
        return;
    }
    
    // PERBAIKAN: Cek duplikat dengan konversi tipe data yang tepat
    const duplicate = kasirItems.find(i => {
        const itemId = Number(i.id);
        const editId = editingItemId ? Number(editingItemId) : null;
        return i.code === code && itemId !== editId;
    });
    
    if (duplicate) {
        showNotification(`Kode "${code}" sudah digunakan!`, 'error');
        return;
    }
    
    if (categoryId && !kasirCategories.some(c => c.id === categoryId)) {
        showNotification('Kategori tidak valid', 'error');
        return;
    }
    
    if (satuanId && !kasirSatuan.some(s => s.id === satuanId)) {
        showNotification('Satuan tidak valid', 'error');
        return;
    }
    
    const unitConversions = tempUnitConversions.map(conv => {
        if (!conv.id) conv.id = Date.now() + Math.floor(Math.random() * 1000);
        return conv;
    });
    
    const now = new Date().toISOString();
    
    try {
        if (editingItemId) {
            // MODE EDIT - Ambil data dari database
            const item = await dbGet(STORES.KASIR_ITEMS, editingItemId);
            if (!item) throw new Error('Item tidak ditemukan');
            
            Object.assign(item, {
                name, code, barcode, categoryId, hargaDasar, hargaJual, berat, satuanId,
                diskon, stock, minStock, isWeighable, track_batch, track_serial,
                priceLevels, unitConversions,
                updatedAt: now
            });
            
            await dbPut(STORES.KASIR_ITEMS, item);
            showNotification('Item berhasil diupdate', 'success');
        } else {
            // MODE TAMBAH
            const newItem = {
                name, code, barcode, categoryId, hargaDasar, hargaJual, berat, satuanId,
                diskon, stock, minStock, isWeighable, track_batch, track_serial,
                priceLevels, unitConversions,
                createdAt: now,
                updatedAt: now
            };
            
            await dbAdd(STORES.KASIR_ITEMS, newItem);
            showNotification('Item berhasil ditambahkan', 'success');
        }
        
        await loadKasirItems();
        navigateTo('listItems');
    } catch (error) {
        showNotification('Gagal menyimpan: ' + error.message, 'error');
    }
}

// ==================== FUNGSI LEVEL HARGA ====================
function addLevelRow(minQty = '', price = '') {
    const container = document.getElementById('level-harga-container');
    const index = container.children.length + 1;
    const row = document.createElement('div');
    row.className = 'level-harga-item';
    row.innerHTML = `
        <span class="level-number">Level ${index}</span>
        <input type="number" class="form-input level-minqty" placeholder="Min. Qty" value="${minQty}" min="1" step="1">
        <input type="number" class="form-input level-price" placeholder="Harga" value="${price}" min="0" step="0.01">
        <button type="button" class="level-harga-remove" onclick="this.closest('.level-harga-item').remove()">×</button>
    `;
    container.appendChild(row);
}

function getPriceLevelsFromDOM() {
    const rows = document.querySelectorAll('.level-harga-item');
    const levels = [];
    rows.forEach(row => {
        const minQty = parseFloat(row.querySelector('.level-minqty').value);
        const price = parseFloat(row.querySelector('.level-price').value);
        if (!isNaN(minQty) && !isNaN(price) && minQty > 0 && price >= 0) {
            levels.push({ minQty, price });
        }
    });
    levels.sort((a, b) => a.minQty - b.minQty);
    return levels;
}

// ==================== FUNGSI KONVERSI SATUAN ====================
function renderConversionsList() {
    const list = document.getElementById('conversions-list');
    if (!list) return;
    list.innerHTML = '';
    if (tempUnitConversions.length === 0) {
        list.innerHTML = '<p style="color:#666; text-align:center;">Belum ada konversi</p>';
        return;
    }
    tempUnitConversions.forEach((conv, index) => {
        const unitName = kasirSatuan.find(s => s.id === conv.unit)?.name || '?';
        const div = document.createElement('div');
        div.className = 'conversion-item';
        div.innerHTML = `
            <div class="conversion-info">
                <strong>${unitName}</strong> = ${conv.value} satuan dasar<br>
                Barcode: ${conv.barcode || '-'}<br>
                Harga Jual: ${formatRupiah(conv.sellPrice || 0)}
            </div>
            <div class="conversion-actions">
                <button class="action-btn edit-btn" onclick="editConversion(${index})">✏️</button>
                <button class="action-btn delete-btn" onclick="deleteConversion(${index})">🗑️</button>
            </div>
        `;
        list.appendChild(div);
    });
}

function showConversionModal() {
    document.getElementById('conv-unit').innerHTML = '<option value="">-- Pilih Satuan --</option>' +
        kasirSatuan.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    document.getElementById('conv-value').value = '';
    document.getElementById('conv-barcode').value = '';
    document.getElementById('conv-sku').value = '';
    document.getElementById('conv-base-price').value = '';
    document.getElementById('conv-sell-price').value = '';
    document.getElementById('conv-points').value = '';
    document.getElementById('conv-commission').value = '';
    editingConversionIndex = -1;
    document.getElementById('conversion-modal-title').textContent = 'Tambah Konversi Satuan';
    document.getElementById('conversion-modal').style.display = 'flex';
}

function editConversion(index) {
    const conv = tempUnitConversions[index];
    if (!conv) return;
    const unitSelect = document.getElementById('conv-unit');
    unitSelect.innerHTML = '<option value="">-- Pilih Satuan --</option>' +
        kasirSatuan.map(s => `<option value="${s.id}" ${s.id === conv.unit ? 'selected' : ''}>${s.name}</option>`).join('');
    document.getElementById('conv-value').value = conv.value;
    document.getElementById('conv-barcode').value = conv.barcode || '';
    document.getElementById('conv-sku').value = conv.sku || '';
    document.getElementById('conv-base-price').value = conv.basePrice || '';
    document.getElementById('conv-sell-price').value = conv.sellPrice || '';
    document.getElementById('conv-points').value = conv.points || '';
    document.getElementById('conv-commission').value = conv.commission || '';
    editingConversionIndex = index;
    document.getElementById('conversion-modal-title').textContent = 'Edit Konversi Satuan';
    document.getElementById('conversion-modal').style.display = 'flex';
}

function deleteConversion(index) {
    if (confirm('Hapus konversi ini?')) {
        tempUnitConversions.splice(index, 1);
        renderConversionsList();
    }
}

function closeConversionModal() {
    document.getElementById('conversion-modal').style.display = 'none';
}

function saveConversionFromModal() {
    const unit = parseInt(document.getElementById('conv-unit').value);
    const value = parseFloat(document.getElementById('conv-value').value);
    const barcode = document.getElementById('conv-barcode').value.trim();
    const sku = document.getElementById('conv-sku').value.trim();
    const basePrice = parseFloat(document.getElementById('conv-base-price').value) || null;
    const sellPrice = parseFloat(document.getElementById('conv-sell-price').value) || null;
    const points = parseFloat(document.getElementById('conv-points').value) || null;
    const commission = parseFloat(document.getElementById('conv-commission').value) || null;
    
    if (!unit || isNaN(value) || value <= 0) {
        showNotification('Satuan dan nilai harus diisi dengan benar', 'error');
        return;
    }
    
    const existingIndex = tempUnitConversions.findIndex((c, idx) => 
        c.unit === unit && idx !== editingConversionIndex
    );
    
    if (existingIndex !== -1) {
        showNotification('Satuan ini sudah ada dalam daftar konversi', 'error');
        return;
    }
    
    const conversion = {
        id: editingConversionIndex >= 0 ? tempUnitConversions[editingConversionIndex].id : Date.now() + Math.random(),
        unit,
        value,
        barcode,
        sku,
        basePrice,
        sellPrice,
        points,
        commission
    };
    
    if (editingConversionIndex >= 0) {
        tempUnitConversions[editingConversionIndex] = conversion;
    } else {
        tempUnitConversions.push(conversion);
    }
    
    renderConversionsList();
    closeConversionModal();
}

function showSelectItemModal(callback) {
    selectItemCallback = callback;
    document.getElementById('item-search-input').value = '';
    document.getElementById('item-list-container').innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Ketikkan pencarian...</div>';
    document.getElementById('select-item-modal').style.display = 'flex';
}

function closeSelectItemModal() {
    document.getElementById('select-item-modal').style.display = 'none';
    selectItemCallback = null;
}

function searchItems() {
    const keyword = document.getElementById('item-search-input').value.toLowerCase().trim();
    const container = document.getElementById('item-list-container');
    
    if (!keyword) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Ketikkan pencarian...</div>';
        return;
    }
    
    const filtered = kasirItems.filter(item =>
        item.name.toLowerCase().includes(keyword) ||
        item.code.toLowerCase().includes(keyword) ||
        (item.barcode && item.barcode.toLowerCase().includes(keyword))
    );
    
    if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Tidak ditemukan</div>';
        return;
    }
    
    let html = '';
    filtered.forEach(item => {
        html += `
            <div class="item-row">
                <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    <div class="item-details">
                        <span class="item-code">${item.code}</span>
                        ${item.barcode ? `<span class="item-barcode">${item.barcode}</span>` : ''}
                    </div>
                </div>
                <button class="select-btn" onclick="selectItem(${item.id})">Pilih</button>
            </div>
        `;
    });
    container.innerHTML = html;
}

function selectItem(itemId) {
    const item = kasirItems.find(i => i.id === itemId);
    if (selectItemCallback && item) {
        selectItemCallback(item);
    }
    closeSelectItemModal();
}

// ==================== LOGOUT ====================
function logout() {
    if (confirm('Apakah Anda yakin ingin keluar?')) {
        sessionStorage.removeItem('currentUser');
        window.location.href = 'index.html';
    }
}

// ==================== INISIALISASI HALAMAN ====================
async function initMasterPage() {
    try {
        await initDatabase();
        await loadKasirCategories();
        await loadKasirItems();
        await loadKasirSatuan();
        await loadBundles();
        
        const savedUser = sessionStorage.getItem('currentUser');
        if (savedUser) {
            const parsed = JSON.parse(savedUser);
            if (parsed.id === 'bypass') {
                currentUser = { ...parsed, permissions: [] };
                document.getElementById('user-name-display').textContent = parsed.name;
            } else {
                const user = await dbGet(STORES.USERS, parsed.id);
                if (user) {
                    currentUser = user;
                    document.getElementById('user-name-display').textContent = user.name;
                } else {
                    sessionStorage.removeItem('currentUser');
                    window.location.href = 'index.html';
                    return;
                }
            }
        } else {
            window.location.href = 'index.html';
            return;
        }
        
        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action');
        const id = urlParams.get('id');
        
        if (action === 'addItem') {
            showAddItemPage();
        } else if (action === 'editItem' && id) {
            showEditItemPage(parseInt(id));
        } else if (action === 'listItems') {
            showItemListPage();
        } else if (action === 'addCategory') {
            showAddCategoryPage();
        } else if (action === 'editCategory' && id) {
            showEditCategoryPage(parseInt(id));
        } else if (action === 'listCategories') {
            showCategoryListPage();
        } else if (action === 'addUnit') {
            showAddUnitPage();
        } else if (action === 'editUnit' && id) {
            showEditUnitPage(parseInt(id));
        } else if (action === 'listUnits') {
            showUnitListPage();
        } else if (action === 'addBundle') {
            showAddBundlePage();
        } else if (action === 'editBundle' && id) {
            showEditBundlePage(parseInt(id));
        } else if (action === 'listBundles') {
            showBundleListPage();
        } else if (action === 'addBOM') {
            showAddBOMForm();
        } else if (action === 'editBOM' && id) {
            showEditBOMPage(parseInt(id));
        } else if (action === 'listBOMs') {
            showBOMListPage();
        } else {
            document.getElementById('master-content').innerHTML = `
                <div class="content-card">
                    <h2 class="page-title">Master Data</h2>
                    <p>Silakan pilih menu di samping untuk mengelola data master.</p>
                </div>
            `;
        }
    } catch (error) {
        console.error('Init error:', error);
        showNotification('Gagal memuat: ' + error.message, 'error');
    }
}

initMasterPage();
