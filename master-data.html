<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUDA - Master Data</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ==================== RESET & BASE STYLES ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: #FFFFFF;
            min-height: 100vh;
            color: #333333;
        }
        /* ==================== HEADER ==================== */
        .app-header {
            background: #FFFFFF;
            color: #006B54;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-title {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #006B54;
        }
        .drawer-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #006B54;
        }
        .drawer-toggle svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .header-actions button {
            background: #FFFFFF;
            color: #006B54;
            padding: 8px 12px;
            border-radius: 15px;
            border: 1px solid #006B54;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .header-actions button:hover {
            background: #006B54;
            color: white;
        }
        .header-actions button svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
            display: block;
        }
        #user-name-display {
            margin-right: 10px;
            font-weight: 600;
            color: #006B54;
        }
        /* ==================== DRAWER SIDEBAR ==================== */
        .sidebar {
            position: fixed;
            left: -220px;
            top: 0;
            width: 220px;
            height: 100vh;
            background: #ffffff;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            z-index: 300;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow-y: auto;
            transition: left 0.3s ease;
        }
        .sidebar.open {
            left: 0;
        }
        .menu-group {
            margin-bottom: 5px;
        }
        .menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #f5f5f5;
            cursor: pointer;
            border-radius: 8px;
            margin: 0 10px 5px;
            font-weight: 700;
            color: #006B54;
        }
        .menu-header .arrow {
            transition: transform 0.2s;
        }
        .menu-header.open .arrow {
            transform: rotate(90deg);
        }
        .sub-menu {
            display: none;
            margin-bottom: 10px;
        }
        .sub-menu button {
            margin: 5px 10px;
            padding: 12px 16px;
            border: 1px solid #006B54;
            border-radius: 15px;
            background: white;
            color: #006B54;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            width: calc(100% - 20px);
        }
        .sub-menu button:hover {
            background: #f0f9f6;
        }
        .sub-menu button svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
        }
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 250;
            display: none;
        }
        .drawer-overlay.show {
            display: block;
        }
        /* ==================== MAIN CONTENT ==================== */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .content-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .page-title {
            color: #006B54;
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .back-button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #006B54;
            border-radius: 15px;
        }
        .back-button:hover {
            background: #f0f9f6;
        }
        .back-button svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        /* ==================== FORM STYLES ==================== */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #333;
            border-radius: 15px;
            font-size: 1rem;
            background: white;
            color: #333;
            transition: all 0.2s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: #006B54;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0,107,84,0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-button-primary {
            background: #006B54;
            color: white;
            border: 1px solid #006B54;
            padding: 12px 16px;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .form-button-primary:hover {
            background: #005a46;
        }
        .form-button-secondary {
            background: #d9d9d9;
            color: #333333;
            border: 1px solid #d9d9d9;
            padding: 12px 16px;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .form-button-secondary:hover {
            background: #cccccc;
        }
        /* ==================== TABLE STYLES ==================== */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 15px;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        .data-table th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }
        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
        }
        .data-table tr:hover {
            background: #f9f9f9;
        }
        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid #006B54;
            background: white;
            color: #006B54;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 5px;
        }
        .action-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
        }
        .action-btn.delete-btn {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        .action-btn.delete-btn:hover {
            background: #ff6b6b;
            color: white;
        }
        .action-btn.edit-btn:hover {
            background: #006B54;
            color: white;
        }
        /* ==================== SEARCH BOX ==================== */
        .search-box {
            margin-bottom: 15px;
        }
        /* ==================== MODAL OVERLAY ==================== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal-content {
            background: #FFFFFF;
            border-radius: 15px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .modal-header {
            padding: 12px 20px;
            color: #006B54;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid rgba(0, 107, 84, 0.1);
        }
        .modal-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #006B54;
        }
        .modal-body {
            padding: 20px;
            max-height: calc(90vh - 60px);
            overflow-y: auto;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            padding: 15px 20px;
            border-top: 1px solid #eee;
            background: #fafafa;
        }
        /* ==================== LIST ITEM UNTUK MODAL ==================== */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 12px 15px;
        }
        .item-info {
            flex: 1;
            min-width: 0;
        }
        .item-name {
            font-weight: 600;
            font-size: 1rem;
            color: #006B54;
            margin-bottom: 4px;
        }
        .item-details {
            font-size: 0.8rem;
            color: #666;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .item-details span {
            white-space: nowrap;
        }
        .item-code, .item-barcode {
            background: #eaeaea;
            padding: 2px 8px;
            border-radius: 12px;
        }
        .select-btn {
            background: #006B54;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 10px;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .select-btn:hover {
            background: #004d3e;
        }
        /* ==================== KONVERSI SATUAN & LEVEL HARGA ==================== */
        .conversions-section, .level-harga-container {
            margin-top: 15px;
        }
        #add-conversion-btn {
            width: 100%;
            padding: 12px;
            border: 2px dashed #006B54;
            border-radius: 15px;
            background: white;
            color: #006B54;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        #add-conversion-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
        }
        .conversions-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .conversion-item {
            background: #f9f9f9;
            border: 1px solid #d9d9d9;
            border-radius: 15px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .conversion-info {
            flex: 1;
        }
        .conversion-actions {
            display: flex;
            gap: 5px;
        }
        .conversion-item .action-btn svg {
            width: 16px;
            height: 16px;
        }
        .level-harga-item {
            display: grid;
            grid-template-columns: 60px 1fr 1fr 36px;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .level-harga-item .level-number {
            font-weight: 600;
            color: #006B54;
            white-space: nowrap;
        }
        .level-harga-item .form-input {
            width: 100%;
            min-width: 0;
        }
        .level-harga-remove {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 0;
            transition: background 0.2s;
        }
        .level-harga-remove:hover {
            background: #ff4c4c;
        }
        .btn-add-level {
            background: #006B54;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 10px 16px;
            margin-top: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-add-level svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
        }
        /* ==================== BOM COMPONENT ROW ==================== */
        .bom-component-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .bom-component-row select,
        .bom-component-row input {
            flex: 1;
        }
        /* ==================== NOTIFICATION ==================== */
        #notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            border-radius: 15px;
            display: none;
            color: white;
            background-color: #006B54;
            max-width: 90%;
            text-align: center;
            z-index: 1001;
            font-size: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        /* Loading spinner */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,107,84,0.3);
            border-radius: 50%;
            border-top-color: #006B54;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header class="app-header">
        <div class="header-content">
            <div class="app-title">
                <button class="drawer-toggle" id="drawer-toggle" onclick="toggleDrawer()">
                    <svg viewBox="0 0 24 24">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                    <line x1="12" y1="22.08" x2="12" y2="12"/>
                </svg>
                <span>Master Data</span>
            </div>
            <div class="header-actions">
                <span id="user-name-display"></span>
                <button onclick="window.location.href='index.html'">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </button>
                <button onclick="logout()">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- ==================== SIDEBAR DRAWER ==================== -->
    <div class="sidebar" id="sidebar">
        <!-- Grup ITEM -->
        <div class="menu-group" id="menu-master">
            <div class="menu-header" onclick="toggleSubMenu(this)">
                <span>ITEM</span>
                <span class="arrow">></span>
            </div>
            <div class="sub-menu">
                <button onclick="navigateTo('addItem'); closeDrawer()">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                    <span>Tambah Item</span>
                </button>
                <button onclick="navigateTo('listItems'); closeDrawer()">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                    </svg>
                    <span>Daftar Item</span>
                </button>
            </div>
        </div>
        <!-- Grup KATEGORI -->
        <div class="menu-group" id="menu-kategori">
            <div class="menu-header" onclick="toggleSubMenu(this)">
                <span>KATEGORI</span>
                <span class="arrow">></span>
            </div>
            <div class="sub-menu">
                <button onclick="navigateTo('addCategory'); closeDrawer()">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                    <span>Tambah Kategori</span>
                </button>
                <button onclick="navigateTo('listCategories'); closeDrawer()">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
                        <path d="M10 2v20"/>
                    </svg>
                    <span>Daftar Kategori</span>
                </button>
            </div>
        </div>
        <!-- Grup SATUAN -->
        <div class="menu-group" id="menu-satuan">
            <div class="menu-header" onclick="toggleSubMenu(this)">
                <span>SATUAN</span>
                <span class="arrow">></span>
            </div>
            <div class="sub-menu">
                <button onclick="navigateTo('addUnit'); closeDrawer()">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                    <span>Tambah Satuan</span>
                </button>
                <button onclick="navigateTo('listUnits'); closeDrawer()">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="3" y1="9" x2="21" y2="9"/>
                        <line x1="9" y1="21" x2="9" y2="9"/>
                    </svg>
                    <span>Daftar Satuan</span>
                </button>
            </div>
        </div>
        <!-- Grup BUNDLE -->
        <div class="menu-group" id="menu-bundle">
            <div class="menu-header" onclick="toggleSubMenu(this)">
                <span>BUNDLE</span>
                <span class="arrow">></span>
            </div>
            <div class="sub-menu">
                <button onclick="navigateTo('addBundle'); closeDrawer()">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                    <span>Tambah Bundle</span>
                </button>
                <button onclick="navigateTo('listBundles'); closeDrawer()">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                    </svg>
                    <span>Daftar Bundle</span>
                </button>
            </div>
        </div>
        <!-- Grup BOM (Bill of Materials) -->
        <div class="menu-group" id="menu-bom">
            <div class="menu-header" onclick="toggleSubMenu(this)">
                <span>BOM</span>
                <span class="arrow">></span>
            </div>
            <div class="sub-menu">
                <button onclick="navigateTo('addBOM'); closeDrawer()">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                    <span>Tambah BOM</span>
                </button>
                <button onclick="navigateTo('listBOMs'); closeDrawer()">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                    </svg>
                    <span>Daftar BOM</span>
                </button>
            </div>
        </div>
    </div>
    <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>

    <!-- ==================== KONTEN UTAMA ==================== -->
    <main class="main-content" id="master-content">
        <!-- Diisi oleh JavaScript -->
    </main>

    <!-- ==================== MODAL KONVERSI SATUAN ==================== -->
    <div class="modal-overlay" id="conversion-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="conversion-modal-title">Tambah Konversi Satuan</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Satuan</label>
                    <select id="conv-unit" class="form-input" required>
                        <option value="">-- Pilih Satuan --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nilai Satuan (berapa unit dasar per satuan ini)</label>
                    <input type="number" id="conv-value" class="form-input" min="0.01" step="0.01" required>
                </div>

        function closeDrawer() {
            const sidebar = document.getElementById('sidebar');

            if (sidebar) sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('show');
            document.querySelectorAll('.sub-menu').forEach(sm => sm.style.display = 'none');
            document.querySelectorAll('.menu-header').forEach(h => h.classList.remove('open'));
        }
        function toggleSubMenu(header) {
            const subMenu = header.nextElementSibling;
            if (subMenu && subMenu.classList.contains('sub-menu')) {
                if (subMenu.style.display === 'block') {
                    subMenu.style.display = 'none';
                    header.classList.remove('open');
                } else {
                    document.querySelectorAll('.sub-menu').forEach(sm => sm.style.display = 'none');
                    document.querySelectorAll('.menu-header').forEach(h => h.classList.remove('open'));
                    subMenu.style.display = 'block';
                    header.classList.add('open');
                }
            }
        }

        // ==================== FUNGSI NOTIFIKASI ====================
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            if (!notification) {
                alert(message);
                return;
            }
            notification.textContent = message;
            notification.style.backgroundColor = type === 'success' ? '#006B54' : (type === 'error' ? '#dc3545' : '#ffc107');
            notification.style.display = 'block';
            if (notification._timeout) clearTimeout(notification._timeout);
            notification._timeout = setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        function formatRupiah(angka) {
            if (angka === null || angka === undefined || isNaN(angka)) return 'Rp 0';
            return 'Rp ' + angka.toLocaleString('id-ID');

        // ==================== DATABASE FUNCTIONS ====================
        async function initDatabase() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    reject('Browser tidak mendukung IndexedDB.');
                    return;
                }
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (e) => reject(e.target.error);
                request.onsuccess = (e) => {
                    db = e.target.result;
                    console.log('Database initialized');
                    resolve();
                };
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    const tx = e.target.transaction;

                    // Create stores if not exist (sama seperti sebelumnya)
                    if (!db.objectStoreNames.contains(STORES.SETTINGS)) {
                        db.createObjectStore(STORES.SETTINGS, { keyPath: 'key' });
                    }
                    if (!db.objectStoreNames.contains(STORES.KASIR_CATEGORIES)) {
                        const catStore = db.createObjectStore(STORES.KASIR_CATEGORIES, { keyPath: 'id', autoIncrement: true });
                        catStore.createIndex('name', 'name', { unique: true });
                    }
                    if (!db.objectStoreNames.contains(STORES.KASIR_ITEMS)) {
                        const itemStore = db.createObjectStore(STORES.KASIR_ITEMS, { keyPath: 'id', autoIncrement: true });
                        itemStore.createIndex('code', 'code', { unique: true });
                    } else {
                        const itemStore = tx.objectStore(STORES.KASIR_ITEMS);
                        itemStore.openCursor().onsuccess = (ev) => {
                            const cursor = ev.target.result;
                            if (cursor) {
                                const item = cursor.value;
                                let updated = false;
                                if (item.track_batch === undefined) { item.track_batch = false; updated = true; }
                                if (item.track_serial === undefined) { item.track_serial = false; updated = true; }
                                if (item.isWeighable === undefined) { item.isWeighable = false; updated = true; }
                                if (item.priceLevels === undefined) { item.priceLevels = []; updated = true; }
                                if (item.unitConversions === undefined) { item.unitConversions = []; updated = true; }
                                if (updated) cursor.update(item);
                                cursor.continue();
                            }
                        };
                    }
                    if (!db.objectStoreNames.contains(STORES.KASIR_SATUAN)) {
                        const satuanStore = db.createObjectStore(STORES.KASIR_SATUAN, { keyPath: 'id', autoIncrement: true });
                        satuanStore.createIndex('name', 'name', { unique: true });
                    }
                    if (!db.objectStoreNames.contains(STORES.CUSTOMERS)) {
                        db.createObjectStore(STORES.CUSTOMERS, { keyPath: 'id', autoIncrement: true });
                    }
                    if (!db.objectStoreNames.contains(STORES.SUPPLIERS)) {
                        db.createObjectStore(STORES.SUPPLIERS, { keyPath: 'id', autoIncrement: true });
                    }
                    if (!db.objectStoreNames.contains(STORES.PENDING_TRANSACTIONS)) {
                        db.createObjectStore(STORES.PENDING_TRANSACTIONS, { keyPath: 'id', autoIncrement: true });
                    }
                    if (!db.objectStoreNames.contains(STORES.SALES)) {
                        const salesStore = db.createObjectStore(STORES.SALES, { keyPath: 'id', autoIncrement: true });
                        salesStore.createIndex('date', 'date', { unique: false });
                    }
                    if (!db.objectStoreNames.contains(STORES.PURCHASES)) {
                        const purchaseStore = db.createObjectStore(STORES.PURCHASES, { keyPath: 'id', autoIncrement: true });
                        purchaseStore.createIndex('date', 'date', { unique: false });
                    }
                    if (!db.objectStoreNames.contains(STORES.USERS)) {
                        const userStore = db.createObjectStore(STORES.USERS, { keyPath: 'id', autoIncrement: true });
                        userStore.createIndex('username', 'username', { unique: true });
                    }
                    if (!db.objectStoreNames.contains(STORES.ROLES)) {
                        const roleStore = db.createObjectStore(STORES.ROLES, { keyPath: 'id', autoIncrement: true });
                        roleStore.createIndex('name', 'name', { unique: true });
                    }
                    if (!db.objectStoreNames.contains(STORES.BUNDLES)) {
                        db.createObjectStore(STORES.BUNDLES, { keyPath: 'id', autoIncrement: true });
                    }
                    if (!db.objectStoreNames.contains(STORES.BILL_OF_MATERIALS)) {
                        const bomStore = db.createObjectStore(STORES.BILL_OF_MATERIALS, { keyPath: 'id', autoIncrement: true });
                        bomStore.createIndex('product_id', 'product_id', { unique: true });
                    }
                    if (!db.objectStoreNames.contains(STORES.WAREHOUSES)) {
                        const whStore = db.createObjectStore(STORES.WAREHOUSES, { keyPath: 'id', autoIncrement: true });
                        whStore.createIndex('code', 'code', { unique: true });
                    }
                };
            });
        }

        async function dbGetAll(storeName) {
            if (!db) throw new Error('Database not initialized');
            return new Promise((resolve, reject) => {
                try {
                    const tx = db.transaction([storeName], 'readonly');
                    const store = tx.objectStore(storeName);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = (e) => reject(e.target.error);
                } catch (error) {
                    reject(error);
                }
            });
        }

        async function dbGet(storeName, key) {
            if (!db) throw new Error('Database not initialized');
            return new Promise((resolve, reject) => {
                try {
                    const tx = db.transaction([storeName], 'readonly');
                    const store = tx.objectStore(storeName);
                    const request = store.get(key);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = (e) => reject(e.target.error);
                } catch (error) {
                    reject(error);
                }
            });
        }

        async function dbAdd(storeName, data) {
            if (!db) throw new Error('Database not initialized');
            return new Promise((resolve, reject) => {
                try {
                    const tx = db.transaction([storeName], 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.add(data);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = (e) => reject(e.target.error);
                } catch (error) {
                    reject(error);
                }
            });
        }

        async function dbPut(storeName, data) {
            if (!db) throw new Error('Database not initialized');
            return new Promise((resolve, reject) => {
                try {
                    const tx = db.transaction([storeName], 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.put(data);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = (e) => reject(e.target.error);
                } catch (error) {
                    reject(error);
                }
            });
        }

        async function dbDelete(storeName, key) {
            if (!db) throw new Error('Database not initialized');
            return new Promise((resolve, reject) => {
                try {
                    const tx = db.transaction([storeName], 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.delete(key);
                    request.onsuccess = () => resolve();
                    request.onerror = (e) => reject(e.target.error);
                } catch (error) {
                    reject(error);
                }
            });
        }

                    if (item.stock === undefined) item.stock = 0;
                    if (item.minStock === undefined) item.minStock = 5;
                    if (item.track_batch === undefined) item.track_batch = false;
                    if (item.track_serial === undefined) item.track_serial = false;
                    if (item.isWeighable === undefined) item.isWeighable = false;
                    if (item.priceLevels === undefined) item.priceLevels = [];
                    if (item.unitConversions === undefined) item.unitConversions = [];

        function showEditItemPage(itemId) {
            const item = kasirItems.find(i => i.id === itemId);
            if (!item) {
                showNotification('Item tidak ditemukan', 'error');
                navigateTo('listItems');
                return;
            }
            editingItemId = itemId;
            tempUnitConversions = item.unitConversions ? JSON.parse(JSON.stringify(item.unitConversions)) : [];
            tempUnitConversions = tempUnitConversions.map((conv, idx) => {
                if (!conv.id) conv.id = idx + 1;
                return conv;
            });

            showAddItemPage();

            setTimeout(() => {
                document.getElementById('kasir-item-name').value = item.name || '';
                document.getElementById('kasir-item-code').value = item.code || '';
                document.getElementById('kasir-item-barcode').value = item.barcode || item.code || '';
                document.getElementById('kasir-item-category').value = item.categoryId || '';
                document.getElementById('kasir-item-harga-dasar').value = item.hargaDasar || '';
                document.getElementById('kasir-item-harga-jual').value = item.hargaJual || '';
                document.getElementById('kasir-item-berat').value = item.berat || '';
                document.getElementById('kasir-item-satuan').value = item.satuanId || '';
                document.getElementById('kasir-item-diskon').value = item.diskon || '';
                document.getElementById('kasir-item-stock').value = item.stock || 0;
                document.getElementById('kasir-item-min-stock').value = item.minStock || 5;
                document.getElementById('kasir-item-weighable').checked = item.isWeighable || false;
                document.getElementById('kasir-item-track-batch').checked = item.track_batch || false;
                document.getElementById('kasir-item-track-serial').checked = item.track_serial || false;

                // MODIFICATION: Sembunyikan grup gudang karena stok awal tidak bisa diubah saat edit
                const warehouseGroup = document.getElementById('warehouse-group');
                if (warehouseGroup) warehouseGroup.style.display = 'none';

                const levelContainer = document.getElementById('level-harga-container');
                levelContainer.innerHTML = '';
                if (item.priceLevels && item.priceLevels.length > 0) {
                    item.priceLevels.forEach(l => addLevelRow(l.minQty, l.price));
                } else {
                    addLevelRow();
                }

                renderConversionsList();
            }, 0);
        }

        // ==================== FUNGSI SAVE ITEM (DIPERBAIKI) MODIFICATION ====================
        async function saveKasirItemFromPage() {
            if (editingItemId) {
                editingItemId = Number(editingItemId);
            }
            const name = document.getElementById('kasir-item-name')?.value.trim();
            const code = document.getElementById('kasir-item-code')?.value.trim();
            const barcode = document.getElementById('kasir-item-barcode')?.value.trim() || code;
            const categoryId = document.getElementById('kasir-item-category')?.value ? parseInt(document.getElementById('kasir-item-category').value) : null;
            const hargaDasar = parseFloat(document.getElementById('kasir-item-harga-dasar')?.value) || null;
            const hargaJual = parseFloat(document.getElementById('kasir-item-harga-jual')?.value) || null;
            const berat = parseFloat(document.getElementById('kasir-item-berat')?.value) || null;
            const satuanId = document.getElementById('kasir-item-satuan')?.value ? parseInt(document.getElementById('kasir-item-satuan').value) : null;
            const diskon = parseFloat(document.getElementById('kasir-item-diskon')?.value) || null;
            const stock = parseFloat(document.getElementById('kasir-item-stock')?.value) || 0;
            const minStock = parseFloat(document.getElementById('kasir-item-min-stock')?.value) || 5;
            const isWeighable = document.getElementById('kasir-item-weighable')?.checked || false;
            const track_batch = document.getElementById('kasir-item-track-batch')?.checked || false;
            const track_serial = document.getElementById('kasir-item-track-serial')?.checked || false;

            // MODIFICATION: Ambil warehouseId jika mode tambah
            const warehouseId = editingItemId ? null : parseInt(document.getElementById('kasir-item-warehouse')?.value);
            if (!editingItemId && !warehouseId) {
                showNotification('Pilih gudang untuk stok awal', 'error');
                return;
            }

            const priceLevels = getPriceLevelsFromDOM();

            if (!name || !code) {
                showNotification('Nama dan kode harus diisi!', 'error');
                return;
            }

            const duplicate = kasirItems.find(i => i.code === code && i.id !== editingItemId);
            if (duplicate) {
                showNotification(`Kode "${code}" sudah digunakan!`, 'error');
                return;
            }

            if (categoryId && !kasirCategories.some(c => c.id === categoryId)) {
                showNotification('Kategori tidak valid', 'error');
                return;
            }
            if (satuanId && !kasirSatuan.some(s => s.id === satuanId)) {
                showNotification('Satuan tidak valid', 'error');
                return;
            }

            const unitConversions = tempUnitConversions.map(conv => {
                if (!conv.id) conv.id = Date.now() + Math.floor(Math.random() * 1000);
                return conv;
            });

            const now = new Date().toISOString();

            try {
                if (editingItemId) {
                    // Ambil data terkini dari database
                    const item = await dbGet(STORES.KASIR_ITEMS, editingItemId);
                    if (!item) throw new Error('Item tidak ditemukan');
                    Object.assign(item, {
                        name, code, barcode, categoryId, hargaDasar, hargaJual, berat, satuanId,
                        diskon, stock, minStock, isWeighable, track_batch, track_serial,
                        priceLevels, unitConversions,
                        updatedAt: now
                    });
                    await dbPut(STORES.KASIR_ITEMS, item);
                } else {
                    const newItem = {
                        name, code, barcode, categoryId, hargaDasar, hargaJual, berat, satuanId,
                        diskon, stock, minStock, isWeighable, track_batch, track_serial,
                        priceLevels, unitConversions,
                        createdAt: now, updatedAt: now
                    };
                    const newItemId = await dbAdd(STORES.KASIR_ITEMS, newItem);
                    newItem.id = newItemId;
                    kasirItems.push(newItem);

                    // MODIFICATION: Tambah stok awal ke gudang yang dipilih jika stok > 0 dan item tidak menggunakan serial
                    if (!editingItemId && warehouseId && stock > 0) {
                        try {
                            if (track_serial) {
                                showNotification('Item dengan serial number tidak dapat diberi stok awal. Gunakan menu Pembelian.', 'warning');
                            } else {
                                // Pastikan fungsi addStock tersedia (dari inventory-core.js)
                                if (typeof window.addStock === 'function') {
                                    await window.addStock({
                                        itemId: newItemId,
                                        warehouseId: warehouseId,
                                        quantity: stock,
                                        batchNumber: 'INITIAL',
                                        notes: 'Stok awal saat pembuatan item',
                                        referenceType: 'initial'
                                    });
                                    // Refresh data stok jika perlu
                                    if (typeof window.loadItemStocks === 'function') {
                                        await window.loadItemStocks();
                                    }
                                } else {
                                    console.warn('addStock tidak tersedia, stok awal tidak tercatat di inventory');
                                }
                            }
                        } catch (stockError) {
                            console.error('Gagal menambah stok awal:', stockError);
                            showNotification('Item tersimpan, tetapi stok awal gagal ditambahkan: ' + stockError.message, 'warning');
                        }
                    }
                }
                await loadKasirItems();
                showNotification('Item berhasil disimpan', 'success');
                navigateTo('listItems');
            } catch (error) {
                console.error('Error saving item:', error);
                showNotification('Gagal menyimpan: ' + error.message, 'error');
            }
        }

        // ==================== FUNGSI LEVEL HARGA ====================
        function addLevelRow(minQty = '', price = '') {
            const container = document.getElementById('level-harga-container');
            if (!container) return;
            const index = container.children.length + 1;
            const row = document.createElement('div');
            row.className = 'level-harga-item';
            row.innerHTML = `
                <span class="level-number">Level ${index}</span>
                <input type="number" class="form-input level-minqty" placeholder="Min. Qty" value="${minQty}" min="1" step="1">
                <input type="number" class="form-input level-price" placeholder="Harga" value="${price}" min="0" step="0.01">
                <button type="button" class="level-harga-remove" onclick="this.closest('.level-harga-item').remove()">×</button>
            `;
            container.appendChild(row);
        }

        function getPriceLevelsFromDOM() {
            const rows = document.querySelectorAll('.level-harga-item');
            const levels = [];
            rows.forEach(row => {
                const minQty = parseFloat(row.querySelector('.level-minqty')?.value);
                const price = parseFloat(row.querySelector('.level-price')?.value);
                if (!isNaN(minQty) && !isNaN(price) && minQty > 0 && price >= 0) {
                    levels.push({ minQty, price });
                }
            });
            levels.sort((a, b) => a.minQty - b.minQty);
            return levels;
        }

        // ==================== FUNGSI KONVERSI SATUAN ====================
        function renderConversionsList() {
            const list = document.getElementById('conversions-list');
            if (!list) return;
            list.innerHTML = '';
            if (tempUnitConversions.length === 0) {
                list.innerHTML = '<p style="color:#666; text-align:center;">Belum ada konversi</p>';
                return;
            }
            tempUnitConversions.forEach((conv, index) => {
                const unitName = kasirSatuan.find(s => s.id === conv.unit)?.name || '?';
                const div = document.createElement('div');
                div.className = 'conversion-item';
                div.innerHTML = `
                    <div class="conversion-info">
                        <strong>${unitName}</strong> = ${conv.value} satuan dasar<br>
                        Barcode: ${conv.barcode || '-'}<br>
                        Harga Jual: ${formatRupiah(conv.sellPrice || 0)}
                    </div>
                    <div class="conversion-actions">
                        <button class="action-btn edit-btn" onclick="editConversion(${index})">✏️</button>
                        <button class="action-btn delete-btn" onclick="deleteConversion(${index})">🗑️</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function showConversionModal() {
            const unitSelect = document.getElementById('conv-unit');
            if (unitSelect) {
                unitSelect.innerHTML = '<option value="">-- Pilih Satuan --</option>' + 
                    kasirSatuan.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            }
            document.getElementById('conv-value').value = '';
            document.getElementById('conv-barcode').value = '';
            document.getElementById('conv-sku').value = '';
            document.getElementById('conv-base-price').value = '';
            document.getElementById('conv-sell-price').value = '';
            document.getElementById('conv-points').value = '';
            document.getElementById('conv-commission').value = '';
            editingConversionIndex = -1;
            document.getElementById('conversion-modal-title').textContent = 'Tambah Konversi Satuan';
            document.getElementById('conversion-modal').style.display = 'flex';
        }

        function editConversion(index) {
            const conv = tempUnitConversions[index];
            if (!conv) return;
            const unitSelect = document.getElementById('conv-unit');
            unitSelect.innerHTML = '<option value="">-- Pilih Satuan --</option>' + 
                kasirSatuan.map(s => `<option value="${s.id}" ${s.id === conv.unit ? 'selected' : ''}>${s.name}</option>`).join('');
            document.getElementById('conv-value').value = conv.value;
            document.getElementById('conv-barcode').value = conv.barcode || '';
            document.getElementById('conv-sku').value = conv.sku || '';
            document.getElementById('conv-base-price').value = conv.basePrice || '';
            document.getElementById('conv-sell-price').value = conv.sellPrice || '';
            document.getElementById('conv-points').value = conv.points || '';
            document.getElementById('conv-commission').value = conv.commission || '';
            editingConversionIndex = index;
            document.getElementById('conversion-modal-title').textContent = 'Edit Konversi Satuan';
            document.getElementById('conversion-modal').style.display = 'flex';
        }

        function deleteConversion(index) {
            if (confirm('Hapus konversi ini?')) {
                tempUnitConversions.splice(index, 1);
                renderConversionsList();
            }
        }

        function closeConversionModal() {
            document.getElementById('conversion-modal').style.display = 'none';
        }

        function saveConversionFromModal() {
            const unit = parseInt(document.getElementById('conv-unit')?.value);
            const value = parseFloat(document.getElementById('conv-value')?.value);
            const barcode = document.getElementById('conv-barcode')?.value.trim() || '';
            const sku = document.getElementById('conv-sku')?.value.trim() || '';
            const basePrice = parseFloat(document.getElementById('conv-base-price')?.value) || null;
            const sellPrice = parseFloat(document.getElementById('conv-sell-price')?.value) || null;
            const points = parseFloat(document.getElementById('conv-points')?.value) || null;
            const commission = parseFloat(document.getElementById('conv-commission')?.value) || null;

            if (!unit || isNaN(value) || value <= 0) {
                showNotification('Satuan dan nilai harus diisi dengan benar', 'error');
                return;
            }

            const existingIndex = tempUnitConversions.findIndex((c, idx) => c.unit === unit && idx !== editingConversionIndex);
            if (existingIndex !== -1) {
                showNotification('Satuan ini sudah ada dalam daftar konversi', 'error');
                return;
            }

            const conversion = {
                id: editingConversionIndex >= 0 ? tempUnitConversions[editingConversionIndex].id : Date.now() + Math.random(),
                unit,
                value,
                barcode,
                sku,
                basePrice,
                sellPrice,
                points,
                commission
            };

            if (editingConversionIndex >= 0) {
                tempUnitConversions[editingConversionIndex] = conversion;
            } else {
                tempUnitConversions.push(conversion);
            }

            renderConversionsList();
            closeConversionModal();
        }

        // ==================== MODAL PILIH ITEM ====================
        function showSelectItemModal(callback) {
            selectItemCallback = callback;
            document.getElementById('item-search-input').value = '';
            document.getElementById('item-list-container').innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Ketikkan pencarian...</div>';
            document.getElementById('select-item-modal').style.display = 'flex';
        }

        function closeSelectItemModal() {
            document.getElementById('select-item-modal').style.display = 'none';
            selectItemCallback = null;
        }

        function searchItems() {
            const keyword = document.getElementById('item-search-input')?.value.toLowerCase().trim() || '';
            const container = document.getElementById('item-list-container');
            if (!container) return;
            if (!keyword) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Ketikkan pencarian...</div>';
                return;
            }
            const filtered = kasirItems.filter(item => 
                item.name.toLowerCase().includes(keyword) || 
                item.code.toLowerCase().includes(keyword) || 
                (item.barcode && item.barcode.toLowerCase().includes(keyword))
            );
            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Tidak ditemukan</div>';
                return;
            }
            let html = '';
            filtered.forEach(item => {
                html += `
                    <div class="item-row">
                        <div class="item-info">
                            <div class="item-name">${item.name}</div>
                            <div class="item-details">
                                <span class="item-code">${item.code}</span>
                                ${item.barcode ? `<span class="item-barcode">${item.barcode}</span>` : ''}
                            </div>
                        </div>
                        <button class="select-btn" onclick="selectItem(${item.id})">Pilih</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function selectItem(itemId) {
            const item = kasirItems.find(i => i.id === itemId);
            if (selectItemCallback && item) {
                selectItemCallback(item);
            }
            closeSelectItemModal();
        }

        // ==================== LOGOUT ====================
        function logout() {
            if (confirm('Apakah Anda yakin ingin keluar?')) {
                sessionStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            }
        }

        // ==================== INISIALISASI HALAMAN (MODIFICATION) ====================
        async function initMasterPage() {
            console.log('initMasterPage started');
            try {
                await initDatabase();
                console.log('Database OK');
                await loadKasirCategories();
                console.log('Categories OK');
                await loadKasirItems();
                console.log('Items OK');
                await loadKasirSatuan();
                console.log('Satuan OK');
                await loadBundles();
                console.log('Bundles OK');
                // MODIFICATION: Muat data gudang
                await loadWarehouses();
                console.log('Warehouses OK, jumlah:', warehouses.length);

                const savedUser = sessionStorage.getItem('currentUser');
                if (savedUser) {
                    const parsed = JSON.parse(savedUser);
                    if (parsed.id === 'bypass') {
                        currentUser = { ...parsed, permissions: [] };
                        document.getElementById('user-name-display').textContent = parsed.name;
                    } else {
                        const user = await dbGet(STORES.USERS, parsed.id);
                        if (user) {
                            currentUser = user;
                            document.getElementById('user-name-display').textContent = user.name;
                        } else {
                            sessionStorage.removeItem('currentUser');
                            window.location.href = 'index.html';
                            return;
                        }
                    }
                } else {
                    window.location.href = 'index.html';
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                const action = urlParams.get('action');
                const id = urlParams.get('id');

                if (action === 'addItem') {
                    showAddItemPage();
                } else if (action === 'editItem' && id) {
                    showEditItemPage(parseInt(id));
                } else if (action === 'listItems') {
                    showItemListPage();
                } else if (action === 'addCategory') {
                    showAddCategoryPage();
                } else if (action === 'editCategory' && id) {
                    showEditCategoryPage(parseInt(id));
                } else if (action === 'listCategories') {
                    showCategoryListPage();
                } else if (action === 'addUnit') {
                    showAddUnitPage();
                } else if (action === 'editUnit' && id) {
                    showEditUnitPage(parseInt(id));
                } else if (action === 'listUnits') {
                    showUnitListPage();
                } else if (action === 'addBundle') {
                    showAddBundlePage();
                } else if (action === 'editBundle' && id) {
                    showEditBundlePage(parseInt(id));
                } else if (action === 'listBundles') {
                    showBundleListPage();
                } else if (action === 'addBOM') {
                    showAddBOMForm();
                } else if (action === 'editBOM' && id) {
                    showEditBOMPage(parseInt(id));
                } else if (action === 'listBOMs') {
                    showBOMListPage();
                } else {
                    document.getElementById('master-content').innerHTML = `
                        <div class="content-card">
                            <h2 class="page-title">Master Data</h2>
                            <p>Silakan pilih menu di samping untuk mengelola data master.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Init error:', error);
                showNotification('Gagal memuat: ' + error.message, 'error');
                document.getElementById('master-content').innerHTML = `
                    <div class="content-card">
                        <h2 class="page-title">Error</h2>
                        <p style="color:red;">Gagal memuat halaman: ${error.message}</p>
                        <button class="form-button-primary" onclick="location.reload()">Muat Ulang</button>
                    </div>
                `;
            }
        }

        // Panggil init setelah DOM siap
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMasterPage);
        } else {
            initMasterPage();
        }

        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.style.display = 'none';
            }
        };

        // Ekspor fungsi ke global
        window.toggleDrawer = toggleDrawer;
        window.closeDrawer = closeDrawer;
        window.toggleSubMenu = toggleSubMenu;
        window.navigateTo = navigateTo;
        window.logout = logout;
        window.showConversionModal = showConversionModal;
        window.closeConversionModal = closeConversionModal;
        window.saveConversionFromModal = saveConversionFromModal;
        window.editConversion = editConversion;
        window.deleteConversion = deleteConversion;
        window.addLevelRow = addLevelRow;
        window.addBOMComponentRow = addBOMComponentRow; // asumsi fungsi ini sudah ada di kode asli
        window.updateUnitOptions = updateUnitOptions;
        window.saveBOMFromPage = saveBOMFromPage;
        window.viewBOM = viewBOM;
        window.closeBOMViewModal = closeBOMViewModal;
        window.deleteBOMPrompt = deleteBOMPrompt;
        window.showSelectItemModal = showSelectItemModal;
        window.closeSelectItemModal = closeSelectItemModal;
        window.searchItems = searchItems;
        window.selectItem = selectItem;
        window.addBundleItem = addBundleItem;
        window.updateBundleItemQty = updateBundleItemQty;
        window.saveCategoryFromPage = saveCategoryFromPage;
        window.saveUnitFromPage = saveUnitFromPage;
        window.saveBundleFromPage = saveBundleFromPage;
        window.saveKasirItemFromPage = saveKasirItemFromPage;
        window.deleteCategoryPrompt = deleteCategoryPrompt;
        window.deleteUnitPrompt = deleteUnitPrompt;
        window.deleteBundlePrompt = deleteBundlePrompt;
        window.deleteItemPrompt = deleteItemPrompt;
    </script>
