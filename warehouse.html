<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUDA - Manajemen Gudang</title>
    <style>
        /* ==================== RESET & BASE ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }

        /* ==================== HEADER ==================== */
        .app-header {
            background: #FFFFFF;
            color: #006B54;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .app-header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #006B54;
        }
        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #006B54;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        #user-name-display {
            font-weight: 600;
            color: #006B54;
            margin-left: auto;
            margin-right: 10px;
        }
        .logout-btn {
            background: none;
            border: 1px solid #006B54;
            border-radius: 15px;
            padding: 8px 12px;
            color: #006B54;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: #006B54;
            color: white;
        }
        .logout-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* ==================== MAIN CONTENT ==================== */
        .main-content {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .page-header h2 {
            color: #006B54;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tombol */
        button {
            border-radius: 15px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #006B54;
            color: white;
            border: 1px solid #006B54;
        }
        .btn-primary:hover {
            background: #005a46;
        }
        .btn-secondary {
            background: #d9d9d9;
            color: #333;
            border: 1px solid #d9d9d9;
        }
        .btn-secondary:hover {
            background: #cccccc;
        }
        .btn-danger {
            background: #ff6b6b;
            color: white;
            border: 1px solid #ff6b6b;
        }
        .btn-danger:hover {
            background: #ff5252;
        }
        .action-btn {
            padding: 6px 12px;
            margin-right: 5px;
        }

        /* Tabel */
        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #006B54;
            color: white;
            padding: 12px;
            text-align: left;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        tr:hover {
            background: #f5f5f5;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #006B54;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #333;
            border-radius: 15px;
            font-size: 1rem;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* Notifikasi */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            border-radius: 15px;
            background: #006B54;
            color: white;
            display: none;
            z-index: 2000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #006B54;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="app-header">
        <button class="back-btn" onclick="window.location.href='index.html'">
            <svg viewBox="0 0 24 24">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <h1>Manajemen Gudang</h1>
        <span id="user-name-display"></span>
        <button class="logout-btn" onclick="logout()">
            <svg viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </button>
    </header>

    <div class="main-content">
        <div class="page-header">
            <h2>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#006B54" stroke-width="2">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                </svg>
                Daftar Gudang
            </h2>
            <button class="btn-primary" onclick="showAddWarehouseForm()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                Tambah Gudang
            </button>
        </div>

        <div class="table-container">
            <div id="warehouse-table-container">
                <!-- Tabel akan diisi oleh JavaScript -->
                <p style="text-align:center; padding:20px;">Memuat data...</p>
            </div>
        </div>
    </div>

    <!-- Modal Tambah/Edit Gudang -->
    <div id="warehouse-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="warehouse-modal-title">Tambah Gudang</h2>
                <button class="close-btn" onclick="closeWarehouseModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Kode Gudang *</label>
                    <input type="text" id="warehouse-code" placeholder="Contoh: WH01" maxlength="20">
                </div>
                <div class="form-group">
                    <label>Nama Gudang *</label>
                    <input type="text" id="warehouse-name" placeholder="Contoh: Gudang Utama">
                </div>
                <div class="form-group">
                    <label>Lokasi</label>
                    <input type="text" id="warehouse-location" placeholder="Contoh: Jl. Raya No. 123">
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="warehouse-active" checked>
                    <label for="warehouse-active">Aktif</label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeWarehouseModal()">Batal</button>
                <button class="btn-primary" onclick="saveWarehouseFromForm()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div style="margin-top:20px; color:#006B54;">Memproses...</div>
    </div>

    <!-- Notifikasi -->
    <div id="notification" class="notification"></div>

    <script src="app.js"></script>
    <script src="inventory-core.js"></script>
    <script src="warehouse.js"></script>
    <script>
        // ==================== INISIALISASI HALAMAN ====================
        async function initPage() {
            // Tampilkan loading
            if (typeof showLoading === 'function') showLoading();
            try {
                // Pastikan database sudah siap (app.js sudah inisialisasi)
                // Tampilkan nama user jika ada
                const savedUser = sessionStorage.getItem('currentUser');
                if (savedUser) {
                    const parsed = JSON.parse(savedUser);
                    document.getElementById('user-name-display').textContent = parsed.name || parsed.username || 'User';
                }

                // Render tabel gudang
                await renderWarehouseTable('warehouse-table-container');
            } catch (error) {
                console.error('Error init page:', error);
                const container = document.getElementById('warehouse-table-container');
                if (container) {
                    container.innerHTML = `<p style="color:red; text-align:center;">Gagal memuat data: ${error.message}</p>`;
                }
            } finally {
                if (typeof hideLoading === 'function') hideLoading();
            }
        }

        // Jalankan saat halaman siap
        window.addEventListener('DOMContentLoaded', initPage);

        // Override fungsi showLoading/hideLoading jika belum ada (fallback)
        if (typeof showLoading !== 'function') {
            window.showLoading = function() {
                document.getElementById('loading').style.display = 'flex';
            };
            window.hideLoading = function() {
                document.getElementById('loading').style.display = 'none';
            };
        }
        if (typeof showNotification !== 'function') {
            window.showNotification = function(message, type) {
                const notif = document.getElementById('notification');
                notif.textContent = message;
                notif.style.backgroundColor = type === 'error' ? '#dc3545' : (type === 'success' ? '#006B54' : '#ffc107');
                notif.style.display = 'block';
                setTimeout(() => { notif.style.display = 'none'; }, 3000);
            };
        }
    </script>
</body>
</html>
