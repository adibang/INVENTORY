<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUDA - Transfer Stok</title>
    <style>
        /* ==================== RESET & BASE ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }

        /* ==================== HEADER ==================== */
        .app-header {
            background: #FFFFFF;
            color: #006B54;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .app-header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #006B54;
        }
        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #006B54;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        #user-name-display {
            font-weight: 600;
            color: #006B54;
            margin-left: auto;
            margin-right: 10px;
        }
        .logout-btn {
            background: none;
            border: 1px solid #006B54;
            border-radius: 15px;
            padding: 8px 12px;
            color: #006B54;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: #006B54;
            color: white;
        }
        .logout-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* ==================== MAIN CONTENT ==================== */
        .main-content {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Tombol */
        button {
            border-radius: 15px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #006B54;
            color: white;
            border: 1px solid #006B54;
        }
        .btn-primary:hover {
            background: #005a46;
        }
        .btn-secondary {
            background: #d9d9d9;
            color: #333;
            border: 1px solid #d9d9d9;
        }
        .btn-secondary:hover {
            background: #cccccc;
        }
        .btn-danger {
            background: #ff6b6b;
            color: white;
            border: 1px solid #ff6b6b;
        }
        .btn-danger:hover {
            background: #ff5252;
        }
        .action-btn {
            padding: 6px 12px;
            margin-right: 5px;
        }
        .add-btn {
            margin-bottom: 15px;
        }

        /* Tabel */
        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #006B54;
            color: white;
            padding: 12px;
            text-align: left;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        tr:hover {
            background: #f5f5f5;
        }

        /* Form */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #333;
            border-radius: 15px;
            font-size: 1rem;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 15px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #006B54;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #333;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* Item rows */
        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .item-row select, .item-row input {
            flex: 1;
        }
        .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Status badge */
        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-draft {
            background: #ccc;
            color: #333;
        }
        .badge-sent {
            background: #ffc107;
            color: #333;
        }
        .badge-received {
            background: #28a745;
            color: white;
        }
        .badge-cancelled {
            background: #dc3545;
            color: white;
        }

        /* Notifikasi */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            border-radius: 15px;
            background: #006B54;
            color: white;
            display: none;
            z-index: 2000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #006B54;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="app-header">
        <button class="back-btn" onclick="window.location.href='index.html'">
            <svg viewBox="0 0 24 24">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <h1>Transfer Stok</h1>
        <span id="user-name-display"></span>
        <button class="logout-btn" onclick="logout()">
            <svg viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </button>
    </header>

    <div class="main-content">
        <div class="table-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="color: #006B54;">Daftar Transfer</h2>
                <button class="btn-primary" onclick="showAddTransferModal()">➕ Transfer Baru</button>
            </div>
            <table id="transfer-table">
                <thead>
                    <tr>
                        <th>No. Transfer</th>
                        <th>Dari Gudang</th>
                        <th>Ke Gudang</th>
                        <th>Tanggal</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="transfer-list">
                    <tr><td colspan="6">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Transfer -->
    <div id="transfer-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="transfer-modal-title">Transfer Baru</h2>
                <button class="close-btn" onclick="closeTransferModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="transfer-form" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label>Nomor Transfer</label>
                        <input type="text" id="transfer-number" readonly class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Dari Gudang *</label>
                        <select id="transfer-from-warehouse" class="form-input" required>
                            <option value="">-- Pilih Gudang Asal --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ke Gudang *</label>
                        <select id="transfer-to-warehouse" class="form-input" required>
                            <option value="">-- Pilih Gudang Tujuan --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tanggal Transfer</label>
                        <input type="date" id="transfer-date" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Catatan</label>
                        <textarea id="transfer-notes" class="form-input" rows="2"></textarea>
                    </div>

                    <h3 style="color: #006B54; margin-top: 20px;">Item yang Ditransfer</h3>
                    <div id="items-container"></div>
                    <button type="button" class="btn-secondary" onclick="addTransferItemRow()" style="width: 100%; margin: 10px 0;">
                        ➕ Tambah Item
                    </button>

                    <div style="margin-top: 20px; text-align: right;">
                        <strong>Total Item: <span id="total-items">0</span></strong>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeTransferModal()">Batal</button>
                <button class="btn-primary" id="save-transfer-btn" onclick="saveTransfer('draft')">Simpan Draft</button>
                <button class="btn-primary" id="send-transfer-btn" onclick="saveTransfer('sent')">Kirim</button>
            </div>
        </div>
    </div>

    <!-- Modal Konfirmasi Terima -->
    <div id="receive-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Terima Transfer</h2>
                <button class="close-btn" onclick="closeReceiveModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>Konfirmasi penerimaan transfer <span id="receive-number"></span>?</p>
                <p>Stok akan ditambahkan ke gudang tujuan dan dikurangi dari gudang asal.</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeReceiveModal()">Batal</button>
                <button class="btn-primary" onclick="confirmReceive()">Ya, Terima</button>
            </div>
        </div>
    </div>

    <!-- Loading & Notifikasi -->
    <div id="loading" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div style="margin-top:20px; color:#006B54;">Memproses...</div>
    </div>
    <div id="notification" class="notification"></div>

    <script>
        // ==================== GLOBAL VARIABLES ====================
        let db = null;
        let currentUser = null;
        let currentTransferId = null; // untuk edit
        let transfers = [];
        let warehouses = [];
        let kasirItems = [];
        let kasirSatuan = [];

        const DB_NAME = 'POSKasirDB';
        const DB_VERSION = 22; // versi terbaru dengan store baru

        // ==================== FUNGSI HELPER ====================
        function showNotification(message, type = 'info') {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.style.backgroundColor = type === 'success' ? '#006B54' : (type === 'error' ? '#dc3545' : '#ffc107');
            notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, 3000);
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function formatRupiah(angka) {
            return 'Rp ' + angka.toLocaleString('id-ID');
        }

        // ==================== CEK SESSION ====================
        async function checkSession() {
            const savedUser = sessionStorage.getItem('currentUser');
            if (!savedUser) {
                window.location.href = 'index.html';
                return false;
            }
            try {
                const parsed = JSON.parse(savedUser);
                if (parsed.id === 'bypass') {
                    currentUser = { ...parsed, name: 'Owner' };
                    document.getElementById('user-name-display').textContent = parsed.name;
                    return true;
                }
                const tx = db.transaction(['users'], 'readonly');
                const store = tx.objectStore('users');
                const request = store.get(parsed.id);
                return new Promise((resolve) => {
                    request.onsuccess = () => {
                        const user = request.result;
                        if (user) {
                            currentUser = user;
                            document.getElementById('user-name-display').textContent = user.name;
                            resolve(true);
                        } else {
                            sessionStorage.removeItem('currentUser');
                            window.location.href = 'index.html';
                            resolve(false);
                        }
                    };
                    request.onerror = () => {
                        window.location.href = 'index.html';
                        resolve(false);
                    };
                });
            } catch (e) {
                window.location.href = 'index.html';
                return false;
            }
        }

        function logout() {
            if (confirm('Apakah Anda yakin ingin keluar?')) {
                sessionStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            }
        }

        // ==================== DATABASE ====================
        async function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('transfers')) {
                        const transferStore = db.createObjectStore('transfers', { keyPath: 'id', autoIncrement: true });
                        transferStore.createIndex('number', 'transferNumber', { unique: true });
                        transferStore.createIndex('status', 'status', { unique: false });
                    }
                    if (!db.objectStoreNames.contains('transfer_items')) {
                        const itemStore = db.createObjectStore('transfer_items', { keyPath: 'id', autoIncrement: true });
                        itemStore.createIndex('transferId', 'transferId', { unique: false });
                    }
                    if (!db.objectStoreNames.contains('warehouses')) {
                        db.createObjectStore('warehouses', { keyPath: 'id', autoIncrement: true });
                    }
                    if (!db.objectStoreNames.contains('item_stocks')) {
                        const stockStore = db.createObjectStore('item_stocks', { keyPath: 'id', autoIncrement: true });
                        stockStore.createIndex('item_warehouse', ['itemId', 'warehouseId'], { unique: true });
                    }
                    if (!db.objectStoreNames.contains('stock_movements')) {
                        const moveStore = db.createObjectStore('stock_movements', { keyPath: 'id', autoIncrement: true });
                        moveStore.createIndex('reference', ['referenceType', 'referenceId'], { unique: false });
                    }
                };
            });
        }

        async function dbGetAll(storeName) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction([storeName], 'readonly');
                const store = tx.objectStore(storeName);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function dbGet(storeName, key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction([storeName], 'readonly');
                const store = tx.objectStore(storeName);
                const request = store.get(key);
                request.onsuccess = () => resolve(request.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function dbAdd(storeName, data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction([storeName], 'readwrite');
                const store = tx.objectStore(storeName);
                const request = store.add(data);
                request.onsuccess = () => resolve(request.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function dbPut(storeName, data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction([storeName], 'readwrite');
                const store = tx.objectStore(storeName);
                const request = store.put(data);
                request.onsuccess = () => resolve(request.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function dbDelete(storeName, key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction([storeName], 'readwrite');
                const store = tx.objectStore(storeName);
                const request = store.delete(key);
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e.target.error);
            });
        }

        // ==================== LOAD DATA ====================
        async function loadWarehouses() {
            try {
                warehouses = await dbGetAll('warehouses');
                warehouses.sort((a,b) => a.name.localeCompare(b.name));
            } catch (error) {
                console.error('Gagal load warehouses:', error);
                warehouses = [];
            }
        }

        async function loadKasirItems() {
            try {
                kasirItems = await dbGetAll('kasirItems');
                kasirItems.forEach(i => { if (i.stock === undefined) i.stock = 0; });
            } catch (error) {
                console.error('Gagal load items:', error);
                kasirItems = [];
            }
        }

        async function loadKasirSatuan() {
            try {
                kasirSatuan = await dbGetAll('kasirSatuan');
            } catch (error) {
                console.error('Gagal load satuan:', error);
                kasirSatuan = [];
            }
        }

        async function loadTransfers() {
            try {
                transfers = await dbGetAll('transfers');
                transfers.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
            } catch (error) {
                console.error('Gagal load transfers:', error);
                transfers = [];
            }
        }

        // ==================== RENDER TABEL TRANSFER ====================
        async function renderTransferTable() {
            const tbody = document.getElementById('transfer-list');
            if (!tbody) return;
            await loadTransfers();
            if (transfers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Belum ada transfer</td></tr>';
                return;
            }
            let html = '';
            for (let t of transfers) {
                const fromWarehouse = warehouses.find(w => w.id === t.fromWarehouseId);
                const toWarehouse = warehouses.find(w => w.id === t.toWarehouseId);
                const fromName = fromWarehouse ? fromWarehouse.name : '-';
                const toName = toWarehouse ? toWarehouse.name : '-';
                const statusClass = t.status === 'draft' ? 'badge-draft' : (t.status === 'sent' ? 'badge-sent' : (t.status === 'received' ? 'badge-received' : 'badge-cancelled'));
                html += `<tr>
                    <td>${t.transferNumber}</td>
                    <td>${fromName}</td>
                    <td>${toName}</td>
                    <td>${t.transferDate ? new Date(t.transferDate).toLocaleDateString('id-ID') : '-'}</td>
                    <td><span class="badge ${statusClass}">${t.status}</span></td>
                    <td>
                        ${t.status === 'draft' ? 
                            `<button class="action-btn" onclick="editTransfer(${t.id})">✏️</button>
                             <button class="action-btn btn-danger" onclick="deleteTransferPrompt(${t.id})">🗑️</button>
                             <button class="action-btn" onclick="sendTransfer(${t.id})">📤 Kirim</button>` : 
                            (t.status === 'sent' ? 
                                `<button class="action-btn" onclick="showReceiveModal(${t.id})">📥 Terima</button>
                                 <button class="action-btn btn-danger" onclick="cancelTransferPrompt(${t.id})">❌ Batal</button>` : 
                                (t.status === 'received' ? 
                                    `<button class="action-btn" onclick="viewTransfer(${t.id})">👁️ Lihat</button>` : 
                                    `<button class="action-btn" onclick="viewTransfer(${t.id})">👁️ Lihat</button>`))}
                    </td>
                </tr>`;
            }
            tbody.innerHTML = html;
        }

        // ==================== GENERATE NOMOR TRANSFER ====================
        async function generateTransferNumber() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const dateStr = `${year}${month}${day}`;

            try {
                const tx = db.transaction(['settings'], 'readonly');
                const store = tx.objectStore('settings');
                const request = store.get('lastTransferNumber');
                const result = await new Promise((resolve, reject) => {
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = reject;
                });

                let lastCounter = 0;
                if (result && result.value) {
                    if (result.value.date === dateStr) {
                        lastCounter = result.value.counter;
                    } else {
                        lastCounter = 0;
                    }
                }

                const newCounter = lastCounter + 1;
                const transferNumber = `TRF-${dateStr}-${String(newCounter).padStart(4, '0')}`;

                const putTx = db.transaction(['settings'], 'readwrite');
                const putStore = putTx.objectStore('settings');
                await new Promise((resolve, reject) => {
                    const req = putStore.put({
                        key: 'lastTransferNumber',
                        value: { date: dateStr, counter: newCounter }
                    });
                    req.onsuccess = resolve;
                    req.onerror = reject;
                });

                return transferNumber;
            } catch (error) {
                console.warn('Gagal generate nomor transfer, pakai fallback', error);
                return `TRF-${dateStr}-${Date.now().toString().slice(-4)}`;
            }
        }

        // ==================== MODAL TRANSFER ====================
        let itemRowsCount = 0;
        const itemRows = [];

        async function showAddTransferModal() {
            currentTransferId = null;
            document.getElementById('transfer-modal-title').textContent = 'Transfer Baru';
            document.getElementById('transfer-number').value = await generateTransferNumber();
            document.getElementById('transfer-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('transfer-notes').value = '';
            document.getElementById('items-container').innerHTML = '';
            itemRows.length = 0;
            itemRowsCount = 0;

            // Isi dropdown gudang
            await loadWarehouses();
            const fromSelect = document.getElementById('transfer-from-warehouse');
            const toSelect = document.getElementById('transfer-to-warehouse');
            fromSelect.innerHTML = '<option value="">-- Pilih Gudang Asal --</option>';
            toSelect.innerHTML = '<option value="">-- Pilih Gudang Tujuan --</option>';
            warehouses.forEach(w => {
                fromSelect.innerHTML += `<option value="${w.id}">${w.code} - ${w.name}</option>`;
                toSelect.innerHTML += `<option value="${w.id}">${w.code} - ${w.name}</option>`;
            });

            document.getElementById('save-transfer-btn').style.display = 'inline-flex';
            document.getElementById('send-transfer-btn').style.display = 'inline-flex';
            document.getElementById('transfer-modal').style.display = 'flex';
        }

        async function editTransfer(id) {
            currentTransferId = id;
            const transfer = await dbGet('transfers', id);
            if (!transfer) return;

            document.getElementById('transfer-modal-title').textContent = 'Edit Transfer';
            document.getElementById('transfer-number').value = transfer.transferNumber;
            document.getElementById('transfer-date').value = transfer.transferDate ? transfer.transferDate.split('T')[0] : '';
            document.getElementById('transfer-notes').value = transfer.notes || '';

            await loadWarehouses();
            const fromSelect = document.getElementById('transfer-from-warehouse');
            const toSelect = document.getElementById('transfer-to-warehouse');
            fromSelect.innerHTML = '<option value="">-- Pilih Gudang Asal --</option>';
            toSelect.innerHTML = '<option value="">-- Pilih Gudang Tujuan --</option>';
            warehouses.forEach(w => {
                fromSelect.innerHTML += `<option value="${w.id}" ${w.id === transfer.fromWarehouseId ? 'selected' : ''}>${w.code} - ${w.name}</option>`;
                toSelect.innerHTML += `<option value="${w.id}" ${w.id === transfer.toWarehouseId ? 'selected' : ''}>${w.code} - ${w.name}</option>`;
            });

            // Load items
            const tx = db.transaction(['transfer_items'], 'readonly');
            const store = tx.objectStore('transfer_items');
            const index = store.index('transferId');
            const range = IDBKeyRange.only(id);
            const items = await new Promise((resolve, reject) => {
                const req = index.getAll(range);
                req.onsuccess = () => resolve(req.result);
                req.onerror = reject;
            });

            document.getElementById('items-container').innerHTML = '';
            itemRows.length = 0;
            itemRowsCount = 0;
            for (let it of items) {
                await addTransferItemRow(it.itemId, it.quantity, it.batchId, it.unitConversionId);
            }

            document.getElementById('save-transfer-btn').style.display = 'inline-flex';
            document.getElementById('send-transfer-btn').style.display = 'inline-flex';
            document.getElementById('transfer-modal').style.display = 'flex';
        }

        async function addTransferItemRow(itemId = '', qty = 1, batchId = '', unitConvId = '') {
            const container = document.getElementById('items-container');
            const rowIndex = itemRowsCount++;
            const rowDiv = document.createElement('div');
            rowDiv.className = 'item-row';
            rowDiv.dataset.index = rowIndex;

            // Item select
            const itemSelect = document.createElement('select');
            itemSelect.className = 'form-input';
            itemSelect.required = true;
            itemSelect.innerHTML = '<option value="">-- Pilih Item --</option>';
            await loadKasirItems();
            kasirItems.forEach(item => {
                itemSelect.innerHTML += `<option value="${item.id}" ${item.id == itemId ? 'selected' : ''}>${item.code} - ${item.name}</option>`;
            });
            itemSelect.onchange = () => updateUnitOptions(rowIndex);

            // Batch input
            const batchInput = document.createElement('input');
            batchInput.type = 'text';
            batchInput.className = 'form-input';
            batchInput.placeholder = 'Batch (opsional)';
            batchInput.value = batchId;

            // Unit select
            const unitSelect = document.createElement('select');
            unitSelect.className = 'form-input unit-select';
            unitSelect.innerHTML = '<option value="">Tanpa Satuan</option>';
            unitSelect.dataset.index = rowIndex;
            if (itemId) {
                await updateUnitOptions(rowIndex, itemId, unitConvId);
            }

            // Qty input
            const qtyInput = document.createElement('input');
            qtyInput.type = 'number';
            qtyInput.className = 'form-input';
            qtyInput.min = '0.01';
            qtyInput.step = '0.01';
            qtyInput.value = qty;
            qtyInput.required = true;

            // Remove button
            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'remove-btn';
            removeBtn.innerHTML = '×';
            removeBtn.onclick = () => {
                container.removeChild(rowDiv);
                updateTotalItems();
            };

            rowDiv.appendChild(itemSelect);
            rowDiv.appendChild(batchInput);
            rowDiv.appendChild(unitSelect);
            rowDiv.appendChild(qtyInput);
            rowDiv.appendChild(removeBtn);
            container.appendChild(rowDiv);
            updateTotalItems();
        }

        async function updateUnitOptions(index, selectedItemId = null, selectedUnitId = '') {
            const row = document.querySelector(`.item-row[data-index="${index}"]`);
            if (!row) return;
            const itemSelect = row.querySelector('select:first-child');
            const unitSelect = row.querySelector('.unit-select');
            const itemId = selectedItemId || itemSelect.value;
            if (!itemId) {
                unitSelect.innerHTML = '<option value="">Tanpa Satuan</option>';
                return;
            }
            const item = kasirItems.find(i => i.id == itemId);
            if (!item || !item.unitConversions || item.unitConversions.length === 0) {
                unitSelect.innerHTML = '<option value="">Tanpa Satuan</option>';
                return;
            }
            await loadKasirSatuan();
            let options = '<option value="">Tanpa Satuan</option>';
            item.unitConversions.forEach(conv => {
                const unitName = kasirSatuan.find(s => s.id == conv.unit)?.name || '?';
                options += `<option value="${conv.id}" ${conv.id == selectedUnitId ? 'selected' : ''}>${unitName} (${conv.value})</option>`;
            });
            unitSelect.innerHTML = options;
        }

        function updateTotalItems() {
            const rows = document.querySelectorAll('.item-row');
            document.getElementById('total-items').textContent = rows.length;
        }

        function closeTransferModal() {
            document.getElementById('transfer-modal').style.display = 'none';
            currentTransferId = null;
        }

        // ==================== SIMPAN TRANSFER ====================
        async function saveTransfer(status) {
            const transferNumber = document.getElementById('transfer-number').value;
            const fromWarehouseId = parseInt(document.getElementById('transfer-from-warehouse').value);
            const toWarehouseId = parseInt(document.getElementById('transfer-to-warehouse').value);
            const transferDate = document.getElementById('transfer-date').value;
            const notes = document.getElementById('transfer-notes').value.trim();

            if (!fromWarehouseId || !toWarehouseId) {
                showNotification('Pilih gudang asal dan tujuan', 'error');
                return;
            }
            if (fromWarehouseId === toWarehouseId) {
                showNotification('Gudang asal dan tujuan tidak boleh sama', 'error');
                return;
            }

            // Kumpulkan item
            const rows = document.querySelectorAll('.item-row');
            if (rows.length === 0) {
                showNotification('Minimal satu item harus ditransfer', 'error');
                return;
            }

            const items = [];
            for (let row of rows) {
                const itemId = parseInt(row.querySelector('select:first-child').value);
                const batchId = row.querySelector('input[type="text"]').value.trim() || null;
                const unitConvId = row.querySelector('.unit-select').value;
                const qty = parseFloat(row.querySelector('input[type="number"]').value);
                if (!itemId || isNaN(qty) || qty <= 0) {
                    showNotification('Item dan jumlah harus diisi dengan benar', 'error');
                    return;
                }
                items.push({
                    itemId,
                    batchId,
                    unitConversionId: unitConvId ? parseInt(unitConvId) : null,
                    quantity: qty
                });
            }

            showLoading();
            try {
                const now = new Date().toISOString();
                const transferData = {
                    transferNumber,
                    fromWarehouseId,
                    toWarehouseId,
                    transferDate: transferDate ? new Date(transferDate).toISOString() : now,
                    notes,
                    status,
                    requestedBy: currentUser?.id,
                    requestedAt: now,
                    createdAt: now,
                    updatedAt: now
                };

                let transferId;
                if (currentTransferId) {
                    // Update existing
                    const existing = await dbGet('transfers', currentTransferId);
                    if (!existing) throw new Error('Transfer tidak ditemukan');
                    transferData.id = currentTransferId;
                    transferData.createdAt = existing.createdAt;
                    transferData.requestedAt = existing.requestedAt;
                    await dbPut('transfers', transferData);
                    transferId = currentTransferId;

                    // Hapus item lama
                    const tx = db.transaction(['transfer_items'], 'readwrite');
                    const store = tx.objectStore('transfer_items');
                    const index = store.index('transferId');
                    const range = IDBKeyRange.only(currentTransferId);
                    const oldItems = await new Promise((resolve, reject) => {
                        const req = index.getAllKeys(range);
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = reject;
                    });
                    for (let key of oldItems) {
                        await new Promise((resolve, reject) => {
                            const req = store.delete(key);
                            req.onsuccess = resolve;
                            req.onerror = reject;
                        });
                    }
                } else {
                    transferId = await dbAdd('transfers', transferData);
                }

                // Simpan item baru
                for (let it of items) {
                    await dbAdd('transfer_items', {
                        transferId,
                        ...it
                    });
                }

                if (status === 'sent') {
                    // Kurangi stok dari gudang asal (hanya jika status sent)
                    await processTransferStock(transferId, 'send');
                }

                hideLoading();
                showNotification(`Transfer ${status === 'draft' ? 'disimpan sebagai draft' : 'dikirim'}`, 'success');
                closeTransferModal();
                await renderTransferTable();
            } catch (error) {
                hideLoading();
                showNotification('Gagal menyimpan: ' + error.message, 'error');
            }
        }

        // ==================== PROSES STOK SAAT KIRIM/TERIMA ====================
        async function processTransferStock(transferId, action) {
            const transfer = await dbGet('transfers', transferId);
            if (!transfer) throw new Error('Transfer tidak ditemukan');

            const tx = db.transaction(['transfer_items'], 'readonly');
            const store = tx.objectStore('transfer_items');
            const index = store.index('transferId');
            const range = IDBKeyRange.only(transferId);
            const items = await new Promise((resolve, reject) => {
                const req = index.getAll(range);
                req.onsuccess = () => resolve(req.result);
                req.onerror = reject;
            });

            const stockTx = db.transaction(['item_stocks', 'stock_movements'], 'readwrite');
            const stockStore = stockTx.objectStore('item_stocks');
            const movementStore = stockTx.objectStore('stock_movements');

            for (let it of items) {
                const itemId = it.itemId;
                const qty = it.quantity;
                let qtyBase = qty;
                if (it.unitConversionId) {
                    const item = kasirItems.find(i => i.id === itemId);
                    if (item && item.unitConversions) {
                        const conv = item.unitConversions.find(u => u.id == it.unitConversionId);
                        if (conv) qtyBase *= conv.value;
                    }
                }

                if (action === 'send') {
                    // Kurangi dari gudang asal
                    const stockIndex = stockStore.index('item_warehouse');
                    const range = IDBKeyRange.only([itemId, transfer.fromWarehouseId]);
                    const stock = await new Promise((resolve, reject) => {
                        const req = stockIndex.get(range);
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = reject;
                    });
                    if (!stock) throw new Error(`Stok item ${itemId} tidak ditemukan di gudang asal`);
                    if (stock.quantity < qtyBase) throw new Error(`Stok tidak cukup untuk item ${itemId}`);
                    stock.quantity -= qtyBase;
                    stock.updated_at = new Date().toISOString();
                    await new Promise((resolve, reject) => {
                        const req = stockStore.put(stock);
                        req.onsuccess = resolve;
                        req.onerror = reject;
                    });

                    // Catat movement
                    await movementStore.add({
                        movement_type: 'transfer_out',
                        item_id: itemId,
                        warehouse_id: transfer.fromWarehouseId,
                        quantity: -qtyBase,
                        reference_id: transferId,
                        reference_type: 'transfer',
                        batch_id: it.batchId,
                        unit_cost: 0,
                        created_at: new Date().toISOString(),
                        created_by: currentUser?.id,
                        notes: `Transfer ke gudang ${transfer.toWarehouseId}`
                    });
                } else if (action === 'receive') {
                    // Tambah ke gudang tujuan
                    const stockIndex = stockStore.index('item_warehouse');
                    const range = IDBKeyRange.only([itemId, transfer.toWarehouseId]);
                    let stock = await new Promise((resolve, reject) => {
                        const req = stockIndex.get(range);
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = reject;
                    });
                    if (stock) {
                        stock.quantity += qtyBase;
                        stock.updated_at = new Date().toISOString();
                        await new Promise((resolve, reject) => {
                            const req = stockStore.put(stock);
                            req.onsuccess = resolve;
                            req.onerror = reject;
                        });
                    } else {
                        // Buat record stok baru
                        stock = {
                            itemId,
                            warehouseId: transfer.toWarehouseId,
                            quantity: qtyBase,
                            min_stock: 0,
                            max_stock: 0,
                            reorder_point: 0,
                            updated_at: new Date().toISOString()
                        };
                        await stockStore.add(stock);
                    }

                    // Catat movement
                    await movementStore.add({
                        movement_type: 'transfer_in',
                        item_id: itemId,
                        warehouse_id: transfer.toWarehouseId,
                        quantity: qtyBase,
                        reference_id: transferId,
                        reference_type: 'transfer',
                        batch_id: it.batchId,
                        unit_cost: 0,
                        created_at: new Date().toISOString(),
                        created_by: currentUser?.id,
                        notes: `Transfer dari gudang ${transfer.fromWarehouseId}`
                    });
                }
            }
        }

        // ==================== FUNGSI LAINNYA ====================
        async function sendTransfer(id) {
            if (!confirm('Kirim transfer ini? Stok akan dikurangi dari gudang asal.')) return;
            showLoading();
            try {
                const transfer = await dbGet('transfers', id);
                if (!transfer) throw new Error('Transfer tidak ditemukan');
                transfer.status = 'sent';
                transfer.sentAt = new Date().toISOString();
                transfer.sentBy = currentUser?.id;
                await dbPut('transfers', transfer);

                await processTransferStock(id, 'send');

                showNotification('Transfer dikirim', 'success');
                await renderTransferTable();
            } catch (error) {
                showNotification('Gagal mengirim: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        let receiveTransferId = null;
        function showReceiveModal(id) {
            receiveTransferId = id;
            document.getElementById('receive-number').textContent = id;
            document.getElementById('receive-modal').style.display = 'flex';
        }

        function closeReceiveModal() {
            document.getElementById('receive-modal').style.display = 'none';
            receiveTransferId = null;
        }

        async function confirmReceive() {
            if (!receiveTransferId) return;
            showLoading();
            try {
                const transfer = await dbGet('transfers', receiveTransferId);
                if (!transfer) throw new Error('Transfer tidak ditemukan');
                transfer.status = 'received';
                transfer.receivedAt = new Date().toISOString();
                transfer.receivedBy = currentUser?.id;
                await dbPut('transfers', transfer);

                await processTransferStock(receiveTransferId, 'receive');

                showNotification('Transfer diterima, stok bertambah', 'success');
                closeReceiveModal();
                await renderTransferTable();
            } catch (error) {
                showNotification('Gagal menerima: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function deleteTransferPrompt(id) {
            if (!confirm('Hapus transfer ini? Item terkait akan ikut terhapus.')) return;
            showLoading();
            try {
                const transfer = await dbGet('transfers', id);
                if (transfer.status !== 'draft') {
                    throw new Error('Hanya transfer dengan status draft yang bisa dihapus');
                }
                // Hapus item
                const tx = db.transaction(['transfer_items'], 'readwrite');
                const store = tx.objectStore('transfer_items');
                const index = store.index('transferId');
                const range = IDBKeyRange.only(id);
                const keys = await new Promise((resolve, reject) => {
                    const req = index.getAllKeys(range);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = reject;
                });
                for (let key of keys) {
                    await new Promise((resolve, reject) => {
                        const req = store.delete(key);
                        req.onsuccess = resolve;
                        req.onerror = reject;
                    });
                }
                await dbDelete('transfers', id);
                showNotification('Transfer dihapus', 'success');
                await renderTransferTable();
            } catch (error) {
                showNotification('Gagal hapus: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function cancelTransferPrompt(id) {
            if (!confirm('Batalkan transfer ini? Stok tidak akan dikembalikan (jika sudah dikirim, perlu adjustment manual).')) return;
            showLoading();
            try {
                const transfer = await dbGet('transfers', id);
                transfer.status = 'cancelled';
                transfer.cancelledAt = new Date().toISOString();
                transfer.cancelledBy = currentUser?.id;
                await dbPut('transfers', transfer);
                showNotification('Transfer dibatalkan', 'success');
                await renderTransferTable();
            } catch (error) {
                showNotification('Gagal membatalkan: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function viewTransfer(id) {
            // Untuk sementara, tampilkan alert dengan data (bisa dikembangkan jadi modal detail)
            const transfer = await dbGet('transfers', id);
            alert(`Transfer ${transfer.transferNumber}\nStatus: ${transfer.status}\nLihat detail lebih lanjut melalui laporan.`);
        }

        // ==================== INISIALISASI ====================
        async function init() {
            showLoading();
            try {
                await initDB();
                const sessionOk = await checkSession();
                if (!sessionOk) return;
                await loadWarehouses();
                await loadKasirItems();
                await loadKasirSatuan();
                await renderTransferTable();
            } catch (error) {
                console.error('Init error:', error);
                showNotification('Gagal memuat data: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        window.onload = init;

        // Ekspos fungsi ke global
        window.showAddTransferModal = showAddTransferModal;
        window.closeTransferModal = closeTransferModal;
        window.addTransferItemRow = addTransferItemRow;
        window.saveTransfer = saveTransfer;
        window.editTransfer = editTransfer;
        window.sendTransfer = sendTransfer;
        window.showReceiveModal = showReceiveModal;
        window.closeReceiveModal = closeReceiveModal;
        window.confirmReceive = confirmReceive;
        window.deleteTransferPrompt = deleteTransferPrompt;
        window.cancelTransferPrompt = cancelTransferPrompt;
        window.viewTransfer = viewTransfer;
    </script>
</body>
